  <circle cx="374" cy="430" r="7" class="badge"/><text x="374" y="433" class="num" text-anchor="middle">28</text>
  <text x="390" y="434" class="tm">INPUTS · WHAT EACH MODEL READS, AND WHAT IT REFUSES</text>
  <text x="386" y="458" class="tm">SCORE2 READS</text>
  <text x="600" y="458" class="tm">LEE READS</text>
  <g class="ts">
    <text x="386" y="476">● age, sex</text>
    <text x="386" y="493">○ current smoking · no</text>
    <text x="386" y="510">● systolic blood pressure</text>
    <text x="386" y="527">● total cholesterol · HDL</text>
    <text x="386" y="544" style="fill:#111">✗ diabetes present — refused</text>
    <text x="386" y="561">● region high · asked once</text>
    <text x="600" y="476">● age 65–69 · 2</text>
    <text x="600" y="493">● male · 2</text>
    <text x="600" y="510">● type 2 diabetes · 1</text>
    <text x="600" y="527">— cancer · lung · heart failure</text>
    <text x="600" y="544">— BMI · four function items</text>
    <text x="600" y="561">○ current smoker · 0</text>
  </g>
  <text x="386" y="579" class="ts">● scored   ○ supplied, did not score   — nobody asked</text>
  <line x1="386" y1="592" x2="794" y2="592" class="line"/>

