<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1480" height="920" fill="#ffffff"/>
  <style>
    .t { font-size: 12px; fill: #111; }
    .tb { font-size: 12px; fill: #111; font-weight: 600; }
    .ts { font-size: 10px; fill: #777; }
    .tm { font-size: 9px; fill: #999; letter-spacing: .06em; }
    .h { font-size: 15px; font-weight: 600; fill: #111; }
    .box { fill: #fff; stroke: #d9d9d9; }
    .soft { fill: #f6f6f6; stroke: none; }
    .line { stroke: #c9c9c9; fill: none; }
    .dash { stroke: #c9c9c9; fill: none; stroke-dasharray: 3 3; }
