<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body — layers, sex, views</title>
<style>
  :root { color-scheme: dark; --bg:#0c0f13; --fg:#e6edf3; --mut:#93a4b5; --line:#25303c; --panel:#131922; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.42 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .bar { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:10px 12px; background:linear-gradient(#0c0f13e8,#0c0f1300); z-index:3; }
  .bar b { font-weight:600; }
  .spacer { flex:1; }
  button { background:#18202b; color:#cfe0f0; border:1px solid var(--line); border-radius:7px;
    padding:5px 10px; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  button:hover { border-color:#3a4c60; }
  button.on { background:#2a3a4c; color:#fff; border-color:#4a6480; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; padding:5px 12px; }
  .seg button.on { background:#2a3a4c; color:#fff; }

  .legend { position:fixed; left:12px; top:56px; bottom:12px; width:236px; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    transition:width .18s ease; z-index:2; }
  .legend header { display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
    border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .legend header .btn { padding:2px 6px; border:1px solid transparent; background:transparent; color:var(--mut); }
  .legend .rows { overflow:auto; padding:6px; display:grid; gap:2px; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .row:hover { background:#18202b; }
  .row .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .cnt { color:var(--mut); font-size:11px; }
  .row .eye { width:26px; height:22px; display:grid; place-items:center; border-radius:5px;
    border:1px solid transparent; background:transparent; color:var(--mut); padding:0; }
  .row .eye:hover { border-color:var(--line); color:var(--fg); }
  .row.off .nm, .row.off .cnt { opacity:.38; }
  .row.off .eye { color:#5a6a7a; }
  svg { display:block; }
  .legend.collapsed { width:44px; }
  .legend.collapsed .rows, .legend.collapsed header span, .legend.collapsed .eye, .legend.collapsed .cnt { display:none; }
  .legend.collapsed header { justify-content:center; border-bottom:0; padding:10px 0; }
  /* organ tree: the organs row is a folder, every organ is a row of its own */
  .row .chev { width:18px; height:20px; flex:none; display:grid; place-items:center; padding:0;
    border:1px solid transparent; background:transparent; color:var(--mut); font-size:10px; }
  .row .chev:hover { border-color:var(--line); color:var(--fg); }
  .row .chev.blank { visibility:hidden; }
  .row.kids { padding-left:22px; }
  .row.kids .dot { width:7px; height:7px; border-radius:50%; opacity:.85; }
  .row.kids .nm { font-size:12px; }
  .row.folder .nm { font-weight:600; }
  .hint { position:fixed; right:12px; bottom:12px; color:#5f7183; }
  .foot { position:fixed; left:264px; bottom:12px; color:#5f7183; }
</style>
</head>
<body>
<div id="stage"></div>

<div class="bar">
  <b>Body</b>
  <button data-mode="body" class="on">1 · one body</button>
  <button data-mode="out">2 · one layer out</button>
  <button data-mode="spread">3 · all apart</button>
  <span class="spacer"></span>
  <div class="seg" id="sex">
    <button data-sex="female">female</button>
    <button data-sex="male" class="on">male</button>
  </div>
  <button id="skinBtn" title="show the skin shell">skin shell</button>
</div>

<aside class="legend" id="legend">
  <header>
    <span>layers</span>
    <button class="btn" id="collapse" title="collapse">◀</button>
  </header>
  <div class="rows" id="rows"></div>
</aside>

<div class="hint">drag to orbit · scroll to zoom</div>
<div class="foot" id="foot"></div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
const LAYERS = [
  { id:"skin",     name:"skin · teeth · nails", color:0xe8c9a0, filesBySex:true },
  { id:"muscles",  name:"muscles",                     color:0xc0554f },
  { id:"bones",    name:"bones",                       color:0xd9d2bd },
  { id:"cardio",   name:"cardio-vascular",             color:0xb33a3a, filesBySex:true },
  { id:"nervous",  name:"nervous system",              color:0xe0b93f, filesBySex:true },
  { id:"lymphoid", name:"lymphoid system",             color:0x9fe07a },
  { id:"organs",   name:"organs",                      color:0xc78fb0 },
  { id:"reproductive", name:"reproductive",            color:0xd98fa4, filesBySex:true },
  // graph-only: never a legend row, only visible while the organs are expanded
  { id:"heart",     name:"heart",                       color:0xc03038, graphOnly:true }
];

const state = { mode:"body", pull:"nervous", sex:"male", skin:false, hidden:new Set(), collapsed:false,
                organsOut:false, organOff:new Set(), treeOpen:false };
const SHELL_OPACITY = 0.45;
const groups = {}, targets = {}, counts = {};
let bodyBox = null, pending = 0;
const organParts = [];      // { mesh, c (local centroid), want (local position) }
let edges = null;           // LineSegments organ -> heart

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias:true });
// NOTE: the scene is authored in the r146 default (linear output). Switching to sRGBEncoding
// brightens the shell but washes the atlas anatomy out, and the anatomy is what has to stay
// legible, so the shell gets its own lift in paint() instead.
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f13);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0, 3.6);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a2028, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.75); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x9db4d0, 0.55); fill.position.set(-3, 1, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-2, 2, -4); scene.add(rim);

function makeGroup(id) {
  if (groups[id]) return groups[id];
  const g = new THREE.Group(); g.name = id;
  const inner = new THREE.Group(); g.add(inner);
  g.userData.inner = inner; g.userData.variants = {};
  scene.add(g);
  groups[id] = g;
  targets[id] = { p:new THREE.Vector3(), s:1 };
  return g;
}

function paint(l, root, tag) {
  const c = new THREE.Color(l.color);
  let n = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    n++;
    if (l.id === "heart") {   // the exporter painted each atrium/leaflet separately: the hub reads as one node
      o.material = new THREE.MeshStandardMaterial({ color: 0xc03038, roughness: 0.55, metalness: 0.02, side: THREE.DoubleSide });
      return;
    }
    const keep = (l.id === "organs" || l.id === "reproductive" || l.id === "heart") && o.material && o.material.color;
    if (l.id === "reproductive" && o.material && o.material.map) {
      o.material.roughness = 0.55;
      o.material.metalness = 0.0;
      o.material.side = THREE.DoubleSide;
      o.material.color.setScalar(0.72);   // the lights clip this small surface otherwise
      return;
    }
    const base = l.id === "skin" ? c.clone()
      : keep ? o.material.color.clone()
      : l.id === "muscles" ? new THREE.Color(0x9e3b38)
      : (o.material && o.material.color ? o.material.color.clone().lerp(c, 0.5) : c);
    const m = new THREE.MeshStandardMaterial({
      color: base, roughness: keep ? 0.6 : 0.72, metalness: 0.02,
      transparent: l.id === "skin", opacity: l.id === "skin" ? SHELL_OPACITY : 1,
      depthWrite: l.id !== "skin", side: l.id === "skin" ? THREE.FrontSide : THREE.DoubleSide
    });
    if (l.id === "lymphoid" || l.id === "nervous") m.emissive = c.clone().multiplyScalar(0.16);
    // the shell has to stay readable against a black page: a faint self-lit term keeps its
    // silhouette off pure black without hiding what is inside
    if (l.id === "skin") {
      m.emissive = base.clone().multiplyScalar(0.14);
      m.roughness = 0.45;
    }
    o.material = m;
  });
  counts[l.id] = (counts[l.id] || 0) + n;
}

const ASSET_VERSION = "20261025b";   // bump when a model changes: Pages caches GLBs hard
const loader = new THREE.GLTFLoader();

const loadedFiles = new Set();
const failedFiles = [];

function loadFile(id, file, variant) {
  const key = id + "/" + file + "/" + (variant || "");
  if (loadedFiles.has(key)) return Promise.resolve();
  loadedFiles.add(key);
  return new Promise(res => {
    pending++;
    loader.load(`models/${file}.glb?v=${ASSET_VERSION}`, gltf => {
      const g = makeGroup(id);
      paint(LAYERS.find(l => l.id === id), gltf.scene, variant);
      if (variant) {
        g.userData.variants[variant] = gltf.scene;
        gltf.scene.visible = false;
        g.userData.inner.add(gltf.scene);
      } else {
        g.userData.inner.add(gltf.scene);
      }
      pending--; buildLegend(); res();
    }, undefined, error => {
      pending--; failedFiles.push(file); buildLegend();
      document.getElementById("foot").textContent = `Could not load ${file}.glb — reload to retry`;
      console.error(`Could not load anatomy layer ${file}`, error);
      res();
    });
  });
}

async function boot() {
  // a second boot must not stack duplicate meshes on the first
  Object.keys(groups).forEach(k => { if (groups[k].parent) groups[k].parent.remove(groups[k]); delete groups[k]; delete targets[k]; });
  Object.keys(counts).forEach(k => delete counts[k]);
  loadedFiles.clear();
  failedFiles.length = 0;
  const jobs = [];
  LAYERS.forEach(l => {
    if (l.filesBySex) return;
    (l.files || [l.id]).forEach(f => jobs.push(loadFile(l.id, f)));
  });
  jobs.push(loadFile("skin", "skinbits2"));   // teeth + nails only: the hair cap is fitted to the
                                              // male head and fits neither sex any more
  jobs.push(loadFile("skin", "skin-female2", "female"));   // v2: Blender Studio base mesh, fitted to the bones
  jobs.push(loadFile("skin", "skin", "male"));   // the hair island IS the male head shell: stripping it
                                                 // left half a head, so the male keeps skin.glb whole
  jobs.push(loadFile("reproductive", "reproductive-female", "female"));
  jobs.push(loadFile("reproductive", "reproductive-male", "male"));
  jobs.push(loadFile("cardio", "cardio", "male"));
  jobs.push(loadFile("cardio", "cardio-female", "female"));
  jobs.push(loadFile("nervous", "nervous", "male"));
  jobs.push(loadFile("nervous", "nervous-female", "female"));
  jobs.push(loadFile("heart", "heart"));      // the graph's centre: the atlas keeps it inside the
                                              // merged cardio mesh, so it is exported on its own
  await Promise.all(jobs);
  normalise();
  collectOrgans();
  buildLegend();
  applySex();
  layout();
  if (failedFiles.length) document.getElementById("foot").textContent = `Could not load: ${failedFiles.join(", ")} — reload to retry`;
}

function normalise() {
  const box = new THREE.Box3();
  Object.values(groups).forEach(g => {
    const b = new THREE.Box3();
    g.userData.inner.children.forEach(ch => { if (ch.visible) b.expandByObject(ch); });
    if (!b.isEmpty()) box.union(b);
  });
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const k = 1.8 / Math.max(size.y, 1e-6);
  Object.values(groups).forEach(g => {
    g.userData.inner.scale.setScalar(k);
    g.userData.inner.position.set(-centre.x*k, -centre.y*k, -centre.z*k);
  });
  bodyBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(0,0,0), size.clone().multiplyScalar(k));
}

const EYE_OPEN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
const EYE_SHUT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.6 10.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.7"/><path d="M6.2 7.6A16.5 16.5 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 4-.8"/></svg>';

function availableOrganCount() {
  let count = 0;
  if (groups.organs) groups.organs.traverse(o => { if (o.isMesh && (state.sex === "male" || !/^(Urethra|Ejaculatory[ _]duct)/i.test(o.name))) count++; });
  return count;
}

function layerCount(l) {
  if (l.id === "organs") return availableOrganCount();
  if (groups[l.id] && Object.keys(groups[l.id].userData.variants || {}).length) return variantCount(l.id, state.sex);
  return counts[l.id] || 0;
}

function buildLegend() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  LAYERS.filter(l => !l.graphOnly).forEach(l => {
    const isOrgans = l.id === "organs";
    const row = document.createElement("div");
    row.className = "row" + (state.hidden.has(l.id) ? " off" : "") + (isOrgans ? " folder" : "");
    row.dataset.layer = l.id;
    const chev = isOrgans
      ? `<button class="chev" title="expand">${state.treeOpen ? "\u25be" : "\u25b8"}</button>`
      : `<span class="chev blank"></span>`;
    row.innerHTML = chev +
      `<span class="dot" style="background:#${l.color.toString(16).padStart(6,"0")}"></span>` +
      `<span class="nm">${l.name}</span><span class="cnt">${layerCount(l)}</span>` +
      `<button class="eye" title="show / hide">${state.hidden.has(l.id) ? EYE_SHUT : EYE_OPEN}</button>`;
    row.onclick = e => {
      if (e.target.closest(".eye")) { toggle(l.id); return; }
      if (e.target.closest(".chev")) { state.treeOpen = !state.treeOpen; buildLegend(); return; }
      if (isOrgans) { state.organsOut = !state.organsOut; state.treeOpen = state.organsOut; buildLegend(); layout(); return; }
      state.pull = l.id;
      state.mode = "out";
      layout();
    };
    rows.appendChild(row);
    if (isOrgans && state.treeOpen) organRows(rows);
  });
}

/* the organs folder: the heart first (it is the graph's hub), then every organ as its own row */
function organRows(rows) {
  const heart = groups.heart && groups.heart.userData.inner.children[0];
  if (heart) rows.appendChild(organRow("heart", "heart", 0xc03038, true));
  organParts.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
    const col = p.mesh.material && p.mesh.material.color ? p.mesh.material.color.getHex() : 0xc78fb0;
    rows.appendChild(organRow(p.name, p.name, col, false));
  });
}

function organRow(id, label, colour, isHeart) {
  const row = document.createElement("div");
  row.className = "row kids" + (state.organOff.has(id) ? " off" : "");
  row.dataset.organ = id;
  row.innerHTML = `<span class="chev blank"></span>` +
    `<span class="dot" style="background:#${colour.toString(16).padStart(6,"0")}"></span>` +
    `<span class="nm" title="${label}">${label.replace(/\.001$/, "").replace(/_/g, " ")}</span>` +
    `<button class="eye" title="${isHeart ? "show / hide the heart" : "put back into the body"}">${state.organOff.has(id) ? EYE_SHUT : EYE_OPEN}</button>`;
  row.onclick = () => { toggleOrgan(id); };
  return row;
}

function toggleOrgan(id) {
  if (state.organOff.has(id)) state.organOff.delete(id); else state.organOff.add(id);
  buildLegend();
  layout();
}

function toggleOrgans() {
  state.organsOut = !state.organsOut;
  state.treeOpen = state.organsOut;
  buildLegend();
  layout();
}

function variantCount(id, sex) {
  const g = groups[id];
  const v = g && g.userData.variants[sex];
  if (!v) return 0;
  let n = 0;
  v.traverse(o => { if (o.isMesh) n++; });
  return n;
}

function toggle(id) {
  if (state.hidden.has(id)) state.hidden.delete(id); else state.hidden.add(id);
  buildLegend();
  layout();
}

function applySex() {
  const g = groups.reproductive;
  if (!g) return;
  Object.values(groups).forEach(gr => {
    if (!gr || !gr.userData.variants) return;
    Object.entries(gr.userData.variants).forEach(([sex, obj]) => {
      const on = sex === state.sex;
      obj.visible = on;
      obj.traverse(o => { o.visible = on; });
    });
  });
  if (groups.organs) groups.organs.traverse(o => {
    if (!o.isMesh) return;
    if (/^(Urethra|Ejaculatory[ _]duct)/i.test(o.name)) o.visible = state.sex === "male";
  });
  // teeth and nails show on both sexes; the hair cap was stripped from the model (strip_hair.py)
  document.querySelectorAll("#sex button").forEach(b => b.classList.toggle("on", b.dataset.sex === state.sex));
  document.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.layer;
    const gr = groups[id];
    if (gr && gr.userData.variants && gr.userData.variants[state.sex]) {
      let n = 0;
      gr.userData.variants[state.sex].traverse(o => { if (o.isMesh) n++; });
      const c = row.querySelector(".cnt");
      if (c) c.textContent = n;
    }
  });
  const organCounter = document.querySelector('.row[data-layer="organs"] .cnt');
  if (organCounter) organCounter.textContent = availableOrganCount();
  document.getElementById("foot").textContent =
    state.sex === "male" ? "male — the atlas body and its 12 reproductive organs"
      : "female — rebuilt tract · 18 separate structures · CC0 surface";
}

function fitDistance(w, h) {
  const v = camera.fov * Math.PI / 180;
  return Math.max((h/2)/Math.tan(v/2), (w/2)/Math.tan(v/2)/camera.aspect) * 1.12;
}

/* --- the organ graph -------------------------------------------------------------------------
   The organs layer is 104 separate meshes, so "a different combination" costs nothing: each
   organ is hidden or moved on its own, no model per combination. Expanded, every organ leaves
   the body and takes a place on a sphere around the heart; one edge per organ runs to the heart,
   the graph's hub. */

const ORGAN_R = 0.85;

function collectOrgans() {
  organParts.length = 0;
  const g = groups.organs;
  if (!g) return;
  g.userData.inner.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const c = o.geometry.boundingBox.getCenter(new THREE.Vector3());
    organParts.push({ mesh: o, c, name: o.name, want: new THREE.Vector3() });
  });
}

function heartCentre() {
  const g = groups.heart;
  if (!g) return new THREE.Vector3(0, 0.2, 0);
  const b = new THREE.Box3().setFromObject(g.userData.inner);
  return b.getCenter(new THREE.Vector3());
}

function organTargets() {
  const hc = heartCentre();
  const list = organParts.slice().sort((a, b) => b.c.y - a.c.y);   // top of the body first
  const N = list.length, golden = Math.PI * (3 - Math.sqrt(5));
  return list.map((p, i) => {
    const y = N === 1 ? 0 : 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = golden * i;
    return new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r).multiplyScalar(ORGAN_R).add(hc);
  });
}

function placeOrgans() {
  if (!state.organsOut) {
    organParts.forEach(p => p.want.set(0, 0, 0));
    if (edges) { scene.remove(edges); edges.geometry.dispose(); edges = null; }
    return;
  }
  const tgts = organTargets();
  // targets are world coordinates; a mesh's position is relative to its own parent (the GLB
  // root carries the Y-up conversion, so going through the parent's matrix is the only safe way)
  groups.organs.updateMatrixWorld(true);
  const bySort = organParts.slice().sort((a, b) => b.c.y - a.c.y);
  const cur = new THREE.Vector3(), tgt = new THREE.Vector3();
  bySort.forEach((p, i) => {
    const parent = p.mesh.parent;
    p.mesh.updateWorldMatrix(true, false);
    p.mesh.localToWorld(cur.copy(p.c));                    // where this organ is now, in world
    tgt.copy(tgts[i]);
    // both points through the parent's matrix, so rotation and scale of the GLB root cancel out;
    // reading mesh.matrix directly was stale whenever the organs had already been moved once
    const d = parent.worldToLocal(tgt).sub(parent.worldToLocal(cur));
    p.want.copy(p.mesh.position).add(d);
  });
  const hc = heartCentre();
  if (!edges) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(organParts.length * 6), 3));
    edges = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x6b5a78, transparent: true, opacity: 0.40, depthWrite: false
    }));
    scene.add(edges);
  }
  updateEdges(hc);
}

function updateEdges(hc) {
  if (!edges) return;
  const arr = edges.geometry.attributes.position.array;
  const v = new THREE.Vector3();
  organParts.forEach((p, i) => {
    p.mesh.getWorldPosition(v);
    arr[i * 6] = v.x; arr[i * 6 + 1] = v.y; arr[i * 6 + 2] = v.z;
    arr[i * 6 + 3] = hc.x; arr[i * 6 + 4] = hc.y; arr[i * 6 + 5] = hc.z;
  });
  edges.geometry.attributes.position.needsUpdate = true;
  edges.geometry.computeBoundingSphere();
}

function layout() {
  if (!bodyBox) return;
  const width = bodyBox.getSize(new THREE.Vector3()).x;
  const graph = state.organsOut;
  const visible = LAYERS.filter(l => groups[l.id] && !l.graphOnly && !state.hidden.has(l.id));
  visible.forEach((l, i) => {
    const t = targets[l.id];
    if (graph) t.p.set(0, 0, 0);
    else if (state.mode === "out") t.p.set(l.id === state.pull ? width * 1.1 : 0, 0, 0);
    else if (state.mode === "spread") t.p.set((i - (visible.length - 1) / 2) * width * 0.9, 0, 0);
    else t.p.set(0, 0, 0);
    t.s = !graph && state.mode === "spread" ? 0.9 : 1;
  });
  LAYERS.forEach(l => {
    const g = groups[l.id];
    if (!g) return;
    if (l.graphOnly) { g.visible = graph && !state.hidden.has(l.id) && !state.organOff.has(l.id); return; }
    g.visible = !state.hidden.has(l.id) && !graph &&
      (l.id !== "skin" || state.skin || state.mode === "spread" || state.pull === "skin");
  });
  // the organ graph is the whole view: organs and the heart, nothing else
  if (graph && groups.organs) groups.organs.visible = !state.hidden.has("organs");
  organParts.forEach(p => { p.mesh.visible = !state.organOff.has(p.name); });

  const skinG = groups.skin;
  if (skinG) skinG.traverse(o => { if (o.isMesh && o.material) { o.material.transparent = state.skin || state.mode === "spread"; o.material.opacity = SHELL_OPACITY; o.material.depthWrite = false; } });
  const mus = groups.muscles;
  if (mus) {
    const see = !graph && state.mode === "body" && !state.hidden.has("muscles");
    mus.traverse(o => { if (o.isMesh && o.material) { o.material.transparent = see; o.material.opacity = see ? 0.38 : 1; o.material.depthWrite = !see; } });
  }

  placeOrgans();

  let cx = 0, cy = 0, spanW = width, spanH = 1.8;
  if (graph) {
    const hc = heartCentre();
    cx = hc.x; cy = hc.y;
    spanW = spanH = ORGAN_R * 2.35;
  } else if (state.mode === "out") { cx = width * 0.55; spanW = width * 2.2; }
  else if (state.mode === "spread") {
    spanW = Math.max(1, visible.length) * width * 0.9 + width * 1.5;
    spanH = 1.62;
    cx = -spanW * 0.10;
  }
  const d = fitDistance(spanW, spanH) * (state.mode === "spread" && !graph ? 1.06 : 1);
  camera.position.set(cx, cy, d);
  controls.target.set(cx, cy, 0);
  controls.update();
  document.querySelectorAll(".bar button[data-mode]").forEach(b => b.classList.toggle("on", !graph && b.dataset.mode === state.mode));
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("pull", !graph && r.dataset.layer === state.pull));
}


document.querySelectorAll(".bar button[data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; layout(); });
document.querySelectorAll("#sex button").forEach(b => b.onclick = () => { state.sex = b.dataset.sex; applySex(); });
document.getElementById("skinBtn").onclick = e => { state.skin = !state.skin; e.currentTarget.classList.toggle("on", state.skin); layout(); };
document.getElementById("collapse").onclick = e => {
  state.collapsed = !state.collapsed;
  document.getElementById("legend").classList.toggle("collapsed", state.collapsed);
  e.currentTarget.textContent = state.collapsed ? "▶" : "◀";
};
addEventListener("keydown", e => {
  if (e.key === "1") { state.mode = "body"; layout(); }
  if (e.key === "2") { state.mode = "out"; layout(); }
  if (e.key === "3") { state.mode = "spread"; layout(); }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const a = 1 - Math.pow(0.001, dt);
  Object.values(groups).forEach(g => {
    const t = targets[g.name]; if (!t) return;
    g.position.lerp(t.p, a);
    g.scale.lerp(new THREE.Vector3(t.s,t.s,t.s), a);
  });
  if (state.organsOut) {
    organParts.forEach(p => p.mesh.position.lerp(p.want, a));   // hidden ones too: they must be home when shown again
    updateEdges(heartCentre());
  }
  controls.update();
  renderer.render(scene, camera);
}
buildLegend();
tick();
boot();

window.__ready = () => pending === 0 && !!bodyBox && failedFiles.length === 0;
window.__loadErrors = () => failedFiles.slice();
window.__setMode = (m, pull) => { state.mode = m; if (pull) state.pull = pull; layout(); };
window.__setSex = s => { state.sex = s; applySex(); };
window.__toggle = id => toggle(id);
window.__organs = (v) => { state.organsOut = v === undefined ? !state.organsOut : !!v; state.treeOpen = state.organsOut; buildLegend(); layout(); };
window.__organOff = (name, v) => { if (v) state.organOff.add(name); else state.organOff.delete(name); buildLegend(); layout(); };
window.__organNames = () => organParts.map(p => p.name);
window.__edgeCount = () => (edges ? edges.geometry.attributes.position.count / 2 : 0);
window.__setSkin = v => { state.skin = !!v; document.getElementById("skinBtn").classList.toggle("on", state.skin); layout(); };
window.__collapse = () => document.getElementById("collapse").click();
</script>
</body>
</html>
