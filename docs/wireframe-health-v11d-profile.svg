  <circle cx="374" cy="608" r="7" class="badge"/><text x="374" y="611" class="num" text-anchor="middle">29</text>
  <text x="390" y="612" class="tm">WHAT NO MODEL READS · NAMED, NOT SMOOTHED OVER</text>
  <text x="386" y="634" class="ts">family history · sleep · vaccinations</text>
  <text x="386" y="651" class="ts">depression · loneliness — absent from both papers</text>
  <text x="386" y="668" class="ts">they stay in the record as facts; the number does not move for them</text>
  <line x1="386" y1="682" x2="794" y2="682" class="line"/>

  <!-- 30 knobs -->
  <circle cx="374" cy="698" r="7" class="badge"/><text x="374" y="701" class="num" text-anchor="middle">30</text>
  <text x="390" y="702" class="tm">WHAT YOU MAY CHANGE · WHAT MOVING IT DOES, IN YEARS</text>
  <text x="386" y="722" class="t">sex</text>
  <text x="466" y="722" class="ts">the other SCORE2 curve, the other Lee weight</text>
  <text x="792" y="722" class="ts" text-anchor="end">−3.4 if female</text>
  <text x="386" y="739" class="t">birth year</text>
  <text x="466" y="739" class="ts">1961 → 1956; outside 40–69 SCORE2 refuses</text>
  <text x="792" y="739" class="ts" text-anchor="end">−2.9 per 5 y</text>
  <text x="386" y="756" class="t">smoker</text>
  <text x="466" y="756" class="ts">on: Lee +2 · quitting: HR 0.61 (0.49–0.76)</text>
  <text x="792" y="756" class="ts" text-anchor="end">−1.9 · +1.2</text>
  <text x="386" y="773" class="t">steps a day</text>
  <text x="466" y="773" class="ts">7k → 10k · no PMID behind it — stays not confirmed</text>
  <text x="792" y="773" class="ts" text-anchor="end">+0.6</text>
  <text x="386" y="789" class="ts">a knob previews: the same two scales with one fact moved — and it writes nothing.</text>
  <text x="386" y="803" class="ts">the record changes when a document says so, never when a knob is turned</text>
  <line x1="386" y1="810" x2="794" y2="810" class="line"/>

  <!-- 31 who may see it -->
  <circle cx="374" cy="822" r="7" class="badge"/><text x="374" y="825" class="num" text-anchor="middle">31</text>
  <text x="390" y="826" class="tm">WHO MAY SEE THIS RECORD</text>
  <text x="386" y="845" class="ts">one file on one device — whoever holds the file sees all of it</text>
  <text x="386" y="859" class="ts">no accounts, no share link, no per-panel permission: the service is not built</text>

