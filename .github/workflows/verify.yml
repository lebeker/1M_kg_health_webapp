# Deterministic checks only. GitHub never hosts an agent, so the agentic end-to-end run (G3, a fresh
# agent driving the built page in Hermes's own browser) happens locally and leaves a receipt: one
# `e2e` commit status on the head it captured. What runs here is the deterministic half — lint,
# types, unit, contract, build — plus the check that the receipt exists when the diff moves the
# product (scripts/e2e/ci-gate.ts, docs/E2E-GATE.md). A check that needs a model is not a check; a
# check that the model's run happened is.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # reading the `e2e` commit status on a pull request's head
  statuses: read

jobs:
  # The rule `(fix|feat|chore)/<JIRA-TICKET>_<description>` is enforced before anything is built,
  # and it is the same function a worker can run locally: `bun scripts/check-branch-name.ts`.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun scripts/check-branch-name.ts "$HEAD_REF"

  # G1 (contract) and G2 (lint + types + unit). Required check: `verify`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the e2e step diffs the pull request against its base, so both ends have to be here
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # G3's receipt. Not the run — the proof that one happened, against this exact head. A diff
      # that moves the app surface (the page, the demo build, the graph view) has to carry a green
      # `e2e` status posted by scripts/e2e/run.ts; anything else leaves `verify` red, and `verify`
      # is required on main, so the branch cannot merge and the card cannot be called done.
      - name: e2e receipt
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_GATE_TIMEOUT: '600'
        run: bun scripts/e2e/ci-gate.ts --head "$E2E_HEAD_SHA" --base "$E2E_BASE_SHA"
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      # the page the published site serves, checked before anything below can regenerate it: a
      # stale `case.html` is a published page that no longer matches the template or the case
      - name: published case
        run: bun run check:case
      # the case page is build output: dist/demo.html is made from kg_demo.json, and the two tests
      # that hold it (scripts/case-artifact.test.ts, scripts/page-storage.test.ts) compare against
      # the file, not against a function's idea of it. `bun run verify` builds it; this job calls
      # `bun run test` directly, so it builds it here.
      - name: case build
        run: bun run build:demo
      - name: unit
        run: bun run test
      - name: contract fixtures
        run: bun run test:contract
      # the split is a user gesture in the viewer (six systems, six edges, all framed): its
      # regression runs against a local server the harness starts itself, so CI needs no browser
      - name: split regression
        run: bun run test:split
      - name: build
        run: bun run build

  # The Jira sync is automation that writes to the ledger; its logic is unit-tested with a fake
  # client, so a mapping or read-back regression fails here rather than on a live ticket.
  sync-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jira sync unit tests
        run: python3 -m unittest discover -s scripts -p 'test_jira_sync.py' -v
