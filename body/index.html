<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body — layers, sex, views</title>
<style>
  :root { color-scheme: dark; --bg:#0c0f13; --fg:#e6edf3; --mut:#93a4b5; --line:#25303c; --panel:#131922; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.42 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .bar { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:10px 12px; background:linear-gradient(#0c0f13e8,#0c0f1300); z-index:3; }
  .bar b { font-weight:600; }
  .spacer { flex:1; }
  button { background:#18202b; color:#cfe0f0; border:1px solid var(--line); border-radius:7px;
    padding:5px 10px; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  button:hover { border-color:#3a4c60; }
  button.on { background:#2a3a4c; color:#fff; border-color:#4a6480; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; padding:3px 12px 4px;
    font-size:19px; line-height:1; color:#7b8b9c; }
  .seg button.on { background:#2a3a4c; }
  .seg button[data-sex="female"].on { color:#f2a0bf; }
  .seg button[data-sex="male"].on { color:#7fb4f2; }

  .legend { position:fixed; left:0; top:48px; bottom:0; width:236px; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--line); border-right:1px solid var(--line);
    overflow:hidden; transition:width .18s ease; z-index:2; }
  .legend header { display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
    border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .legend header .btn { padding:2px 6px; border:1px solid transparent; background:transparent; color:var(--mut); }
  /* a grid column sizes to its widest row, which pushed the eye buttons out of the panel */
  .legend .rows { overflow:auto; padding:6px; display:grid; grid-template-columns:minmax(0,1fr); gap:2px; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .row:hover { background:#18202b; }
  .row .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .cnt { color:var(--mut); font-size:11px; }
  .row .eye { width:26px; height:22px; display:grid; place-items:center; border-radius:5px;
    border:1px solid transparent; background:transparent; color:var(--mut); padding:0; }
  .row .eye:hover { border-color:var(--line); color:var(--fg); }
  .row.off .nm, .row.off .cnt { opacity:.38; }
  .row.off .eye { color:#5a6a7a; }
  svg { display:block; }
  /* collapsed: just the button and a couple of pixels around it */
  .legend.collapsed { width:28px; }
  .legend.collapsed .rows, .legend.collapsed header span, .legend.collapsed .eye, .legend.collapsed .cnt { display:none; }
  .legend.collapsed header { justify-content:center; border-bottom:0; padding:8px 0; }
  /* organ tree: the organs row is a folder, every organ is a row of its own */
  .row .chev { width:18px; height:20px; flex:none; display:grid; place-items:center; padding:0;
    border:1px solid transparent; background:transparent; color:var(--mut); font-size:10px; }
  .row .chev:hover { border-color:var(--line); color:var(--fg); }
  .row .chev.blank { visibility:hidden; }
  .row.kids { padding-left:22px; }
  .row.kids .dot { width:7px; height:7px; border-radius:50%; opacity:.85; }
  .row.kids .nm { font-size:12px; }
  .row.folder .nm { font-weight:600; }
  .hint { position:fixed; right:12px; bottom:12px; color:#5f7183; }
  /* the node panel: what a node is, in words — the same chrome as the layer list, on the right */
  .nodePanel { position:fixed; right:0; top:48px; bottom:0; width:320px; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--line); border-left:1px solid var(--line);
    z-index:2; }
  .nodePanel[hidden] { display:none; }
  .nodePanel header { display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
    border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .nodePanel .nbody { padding:12px 14px 16px; overflow:auto; }
  .nodePanel .ntitle { font-size:16px; font-weight:600; margin-bottom:3px; }
  .nodePanel .nsub { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
  .nodePanel .ndesc { color:#c6d3e0; font-size:12.5px; line-height:1.5; margin:0 0 16px; }
  .nodePanel .nacts { display:flex; flex-direction:column; gap:6px; margin-top:2px; }
  .nodePanel .nacts button { width:100%; justify-content:flex-start; padding:8px 11px; font-size:12.5px;
    background:#18212c; border:1px solid var(--line); border-radius:8px; color:#cfe0f0;
    transition:background .12s ease, border-color .12s ease; }
  .nodePanel .nacts button:hover { background:#1d2836; border-color:#3a4c60; }
  .nodePanel .nacts button.on { background:#233246; border-color:#48627f; color:#fff; }
  .nodePanel .btn { padding:2px 6px; border:1px solid transparent; background:transparent; color:var(--mut); }
  #tip { position:fixed; display:none; z-index:15; pointer-events:none; padding:4px 8px;
    font-size:11px; color:#dbe6f2; background:#161d26; border:1px solid #2a3644; border-radius:5px;
    white-space:nowrap; }
  .foot { position:fixed; left:248px; bottom:10px; color:#5f7183; }
  /* the models are 35 MB: the page has to say what it is doing while they arrive */
  #boot { position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:#0c0f13; transition:opacity .5s ease; }
  #boot.done { opacity:0; pointer-events:none; }
  .bootbox { width:min(420px, 72vw); }
  .bootttl { font-size:15px; letter-spacing:.02em; margin-bottom:12px; }
  .bootstage { color:var(--mut); font-size:12px; min-height:17px; margin-bottom:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bootbar { height:4px; background:#1b2430; border-radius:3px; overflow:hidden; }
  .bootbar i { display:block; height:100%; width:0; background:#7fb3e0; transition:width .2s ease; }
  .bootnum { color:#5f7183; font-size:11px; margin-top:7px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="tip"></div>

<aside id="node" class="nodePanel" hidden>
  <header><span>node</span><button class="btn" id="nodeClose" title="close">✕</button></header>
  <div class="nbody">
    <div class="ntitle" id="npTitle"></div>
    <div class="nsub" id="npSub"></div>
    <p class="ndesc" id="npDesc"></p>
    <div class="nacts" id="npActs"></div>
  </div>
</aside>

<div id="boot">
  <div class="bootbox">
    <div class="bootttl">Body</div>
    <div class="bootstage" id="bootStage">starting…</div>
    <div class="bootbar"><i id="bootBar"></i></div>
    <div class="bootnum" id="bootNum">0 / 0 models</div>
  </div>
</div>

<div class="bar">
  <b>Body</b>

  <span class="spacer"></span>
  <div class="seg" id="sex">
    <button data-sex="female" title="female" aria-label="female">&#9792;</button>
    <button data-sex="male" class="on" title="male" aria-label="male">&#9794;</button>
  </div>
</div>

<aside class="legend" id="legend">
  <header>
    <span>layers</span>
    <button class="btn" id="collapse" title="collapse">◀</button>
  </header>
  <div class="rows" id="rows"></div>
</aside>

<div class="hint">drag to orbit · scroll to zoom · double-click a node to frame it</div>
<div class="foot" id="foot"></div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
const LAYERS = [
  { id:"skin",     name:"skin · teeth · nails", color:0xe8c9a0, filesBySex:true,
    about:"The shell: skin, teeth and nails. Drawn at 45 % so the anatomy under it stays readable; the top-bar button shows it on the assembled body." },
  { id:"muscles",  name:"muscles",                     color:0xc0554f,
    about:"Skeletal muscle, one mesh per muscle or muscle group. Kept at 38 % while it is collapsed inside the body." },
  { id:"bones",    name:"bones",                       color:0xd9d2bd,
    about:"The skeleton: skull, spine, ribs, pelvis and limbs. The frame every other layer is fitted to." },
  { id:"cardio",   name:"cardio-vascular",             color:0xb33a3a, filesBySex:true,
    about:"Heart and vessels, atlas-wide. The heart is merged into this layer rather than being a node of its own." },
  { id:"nervous",  name:"nervous system",              color:0xe0b93f, filesBySex:true,
    about:"Brain, spinal cord and the peripheral nerves. Its own model per sex." },
  { id:"lymphoid", name:"lymphoid system",             color:0x9fe07a,
    about:"Lymph nodes and vessels. The spleen, thymus and tonsils live in this atlas collection but are drawn with the organs." },
  { id:"organs",   name:"organs",                      color:0xc78fb0,
    about:"Every organ the atlas has, as one tree: systems, the organs inside them, and the meshes at the leaves. Split it to get the systems; every row in the list has its own eye." }
];

const state = {
  sex:"male", collapsed:false, hidden:new Set(), sel:null,
  out:new Set(),            // layers taken out of the body; at the start every layer is collapsed
  organsOut:false,          // the organs set split into organ nodes
  nodeOut:new Set(),        // anything that left its parent: a group id, or "m:<mesh>"
  treeOpen:false, openGroups:new Set()
};
const EYE_OUT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
const SHELL_OPACITY = 0.45;
const groups = {}, targets = {}, counts = {};
let bodyBox = null, pending = 0;
const organParts = [];      // { mesh, c (local centroid), want (local position) }
let edges = null;           // LineSegments organ -> heart

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.localClippingEnabled = true;
const headPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0.585);  // keeps what is below her jaw
// NOTE: the scene is authored in the r146 default (linear output). Switching to sRGBEncoding
// brightens the shell but washes the atlas anatomy out, and the anatomy is what has to stay
// legible, so the shell gets its own lift in paint() instead.
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f13);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0, 3.6);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
const camWant = { pos: new THREE.Vector3(0, 0, 3.6), target: new THREE.Vector3(0, 0, 0) };
// what is left of the body once the organs leave it is a node among nodes: it shrinks to the
// height of the organs set, not to a number I made up
function bodyShrink() {
  const h = organSize && organSize.y ? organSize.y : 0.95;
  return Math.min(0.75, Math.max(0.2, h / 1.8));
}
let camAnim = false;
let camUntil = 0;           // a fly-to never owns the camera for longer than this
let camKey = "";        // true only while a layout change is being flown to; after that the
                            // user's own orbit and zoom must not be fought by the animation
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.zoomSpeed = 2.2;              // the default dolly is far too slow to reach one organ
controls.rotateSpeed = 0.9;
controls.minDistance = 0.04;           // you can get your nose into a single organ
controls.maxDistance = 40;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x1a2028, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.75); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x9db4d0, 0.55); fill.position.set(-3, 1, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-2, 2, -4); scene.add(rim);

function makeGroup(id) {
  if (groups[id]) return groups[id];
  const g = new THREE.Group(); g.name = id; g.userData.layerId = id;
  const inner = new THREE.Group(); g.add(inner);
  g.userData.inner = inner; g.userData.variants = {};
  scene.add(g);
  groups[id] = g;
  targets[id] = { p:new THREE.Vector3(), s:1 };
  return g;
}

function paint(l, root, tag) {
  const c = new THREE.Color(l.color);
  let n = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    n++;
    if (l.id === "heart") {   // the exporter painted each atrium/leaflet separately: the hub reads as one node
      o.material = new THREE.MeshStandardMaterial({ color: 0xc03038, roughness: 0.55, metalness: 0.02, side: THREE.DoubleSide });
      return;
    }
    const keep = (l.id === "organs" || l.id === "heart") && o.material && o.material.color;
    if (l.id === "organs" && o.material && o.material.map) {
      o.material.roughness = 0.55;
      o.material.metalness = 0.0;
      o.material.side = THREE.DoubleSide;
      o.material.color.setScalar(0.72);   // the lights clip this small surface otherwise
      return;
    }
    const base = l.id === "skin" ? c.clone()
      : keep ? o.material.color.clone()
      : l.id === "muscles" ? new THREE.Color(0x9e3b38)
      : (o.material && o.material.color ? o.material.color.clone().lerp(c, 0.5) : c);
    const isHead = l.id === "skin" && /-head$/.test(o.name);
    const m = new THREE.MeshStandardMaterial({
      color: base, roughness: keep ? 0.6 : 0.72, metalness: 0.02,
      transparent: l.id === "skin" && !isHead,
      opacity: l.id === "skin" ? (isHead ? 1 : SHELL_OPACITY) : 1,
      depthWrite: l.id !== "skin" || isHead,
      side: l.id === "skin" ? THREE.FrontSide : THREE.DoubleSide
    });
    if (isHead) m.userData.solidHead = true;
    if (l.id === "lymphoid" || l.id === "nervous") m.emissive = c.clone().multiplyScalar(0.16);
    // the shell has to stay readable against a black page: a faint self-lit term keeps its
    // silhouette off pure black without hiding what is inside
    if (l.id === "skin") {
      m.emissive = base.clone().multiplyScalar(0.14);
      m.roughness = 0.45;
    }
    o.material = m;
  });
  counts[l.id] = (counts[l.id] || 0) + n;
}

const ASSET_VERSION = "20261027s";   // bump when a model changes: Pages caches GLBs hard
const loader = new THREE.GLTFLoader();

const loadedFiles = new Set();
const failedFiles = [];
let loadTotal = 0, loadDone = 0;
const loadFrac = new Map();       // per-file progress of what is still in flight

const STAGE_NAMES = {
  skin: "skin · teeth · nails", skinbits2: "teeth · nails", "skin-female2": "her skin",
  muscles: "muscles", bones: "bones", cardio: "cardio-vascular", "cardio-female": "her vessels",
  nervous: "nervous system", "nervous-female": "her nerves", lymphoid: "lymphoid system",
  organs: "organs", spleen: "spleen · thymus · tonsils", "reproductive-female": "her tract",
  "reproductive-male": "his tract"
};

function bootUI(stage, frac) {
  const bar = document.getElementById("bootBar");
  const num = document.getElementById("bootNum");
  const st = document.getElementById("bootStage");
  if (!bar) return;
  let inflight = 0;
  loadFrac.forEach(v => { inflight += v; });
  const done = loadTotal ? Math.min(1, (loadDone + inflight) / loadTotal) : 0;
  bar.style.width = (done * 100).toFixed(1) + "%";
  num.textContent = `${Math.min(loadDone, loadTotal)} / ${loadTotal} models`;
  if (stage) st.textContent = "loading " + (STAGE_NAMES[stage] || stage) + (frac ? ` · ${Math.round(frac * 100)}%` : "…");
}

function bootDone() {
  loadDone = loadTotal;
  bootUI();
  const el = document.getElementById("boot");
  if (el) { el.classList.add("done"); setTimeout(() => el.remove(), 600); }
}

function loadFile(id, file, variant) {
  const key = id + "/" + file + "/" + (variant || "");
  if (loadedFiles.has(key)) return Promise.resolve();
  loadedFiles.add(key);
  return new Promise(res => {
    pending++;
    bootUI(file, 0);
    loader.load(`models/${file}.glb?v=${ASSET_VERSION}`, gltf => {
      loadFrac.delete(file); loadDone++; bootUI();
      const g = makeGroup(id);
      paint(LAYERS.find(l => l.id === id), gltf.scene, variant);
      if (variant) {
        // a sex variant can be several files (a shell, teeth, nails): they share one group
        let vg = g.userData.variants[variant];
        if (!vg) {
          vg = new THREE.Group();
          vg.userData.variant = variant;
          g.userData.variants[variant] = vg;
          g.userData.inner.add(vg);
        }
        vg.add(gltf.scene);
        gltf.scene.userData.variant = variant;   // every part can tell which sex it belongs to
        const on = variant === state.sex;        // a file that lands late must obey the switch already made
        vg.visible = on;
        vg.traverse(o => { o.visible = on; });
      } else {
        g.userData.inner.add(gltf.scene);
      }
      pending--; buildLegend(); res();
    }, xhr => {
      if (xhr && xhr.total) { const f = Math.min(1, xhr.loaded / xhr.total) * 0.999; loadFrac.set(file, f); bootUI(file, f); }
    }, error => {
      loadFrac.delete(file); loadDone++; bootUI();
      pending--; failedFiles.push(file); buildLegend();
      document.getElementById("foot").textContent = `Could not load ${file}.glb — reload to retry`;
      console.error(`Could not load anatomy layer ${file}`, error);
      res();
    });
  });
}

async function boot() {
  // a second boot must not stack duplicate meshes on the first
  Object.keys(groups).forEach(k => { if (groups[k].parent) groups[k].parent.remove(groups[k]); delete groups[k]; delete targets[k]; });
  Object.keys(counts).forEach(k => delete counts[k]);
  loadedFiles.clear();
  failedFiles.length = 0;
  const jobs = [];
  loadTotal = 0; loadDone = 0;
  LAYERS.forEach(l => {
    if (l.filesBySex) return;
    (l.files || [l.id]).forEach(f => jobs.push(loadFile(l.id, f)));
  });
  jobs.push(loadFile("skin", "skinbits2", "male"));        // atlas teeth + nails: his head
  jobs.push(loadFile("skin", "skinbits-female", "female")); // her nails only — the atlas teeth are
                                                            // cut for another skull and pierced her lips
  jobs.push(loadFile("skin", "skin-female2", "female"));   // v2: Blender Studio base mesh, fitted to the bones
  jobs.push(loadFile("skin", "skin", "male"));   // the hair island IS the male head shell: stripping it
                                                 // left half a head, so the male keeps skin.glb whole
  jobs.push(loadFile("organs", "reproductive-female", "female"));   // the tract belongs to the set
  jobs.push(loadFile("organs", "reproductive-male", "male"));
  jobs.push(loadFile("cardio", "cardio", "male"));
  jobs.push(loadFile("cardio", "cardio-female", "female"));
  jobs.push(loadFile("nervous", "nervous", "male"));
  jobs.push(loadFile("nervous", "nervous-female", "female"));
  jobs.push(loadFile("organs", "spleen"));    // the spleen, thymus and tonsils live in the atlas's
                                              // lymphoid collection, so the organs export missed them
  // models/heart.glb is kept for a later "heart" node, but the graph's centre is the organs set      // the graph's centre: the atlas keeps it inside the
                                              // merged cardio mesh, so it is exported on its own
  loadTotal = jobs.length;
  bootUI("organs", 0);
  await Promise.all(jobs);
  normalise();
  collectOrgans();
  buildLegend();
  applySex();
  layout();
  bootDone();
  if (failedFiles.length) document.getElementById("foot").textContent = `Could not load: ${failedFiles.join(", ")} — reload to retry`;
}

const layerMid = {};   // each layer's own centre, in the normalised body frame
const layerSize = {};  // and its own extent, so an out layer can be placed clear of its neighbours

function normalise() {
  const box = new THREE.Box3();
  Object.values(groups).forEach(g => {
    const b = new THREE.Box3();
    g.userData.inner.children.forEach(ch => { if (ch.visible) b.expandByObject(ch); });
    if (!b.isEmpty()) box.union(b);
  });
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const k = 1.8 / Math.max(size.y, 1e-6);
  Object.values(groups).forEach(g => {
    g.userData.inner.scale.setScalar(k);
    g.userData.inner.position.set(-centre.x*k, -centre.y*k, -centre.z*k);
  });
  bodyBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(0,0,0), size.clone().multiplyScalar(k));
  Object.entries(groups).forEach(([id, g]) => {
    const b = new THREE.Box3().setFromObject(g.userData.inner);
    if (!b.isEmpty()) { layerMid[id] = b.getCenter(new THREE.Vector3()); layerSize[id] = b.getSize(new THREE.Vector3()); }
  });
}

const EYE_OPEN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
const EYE_SHUT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.6 10.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.7"/><path d="M6.2 7.6A16.5 16.5 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 4-.8"/></svg>';

function availableOrganCount() {
  // the whole set for this sex, not what is currently in the group: expanded organs are reparented
  return organParts.filter(p => sexOn(p.sex)).length;
}

function layerCount(l) {
  if (l.id === "organs") return availableOrganCount();
  if (groups[l.id] && Object.keys(groups[l.id].userData.variants || {}).length) return variantCount(l.id, state.sex);
  return counts[l.id] || 0;
}

function buildLegend() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  LAYERS.filter(l => !l.graphOnly).forEach(l => {
    const isOrgans = l.id === "organs";
    const isOut = state.out.has(l.id);
    const row = document.createElement("div");
    row.className = "row" + (isOut ? " out" : "") + (isOrgans ? " folder" : "");
    row.dataset.layer = l.id;
    const chev = isOrgans
      ? `<button class="chev" title="expand">${state.treeOpen ? "\u25be" : "\u25b8"}</button>`
      : `<span class="chev blank"></span>`;
    row.innerHTML = chev +
      `<span class="dot" style="background:#${l.color.toString(16).padStart(6,"0")}"></span>` +
      `<span class="nm">${l.name}</span><span class="cnt">${layerCount(l)}</span>` +
      `<button class="eye" title="${isOut ? "put back into the body" : "take out of the body"}">${isOut ? EYE_OPEN : EYE_SHUT}</button>`;
    row.onclick = e => {
      if (e.target.closest(".chev") && isOrgans) { state.treeOpen = !state.treeOpen; buildLegend(); return; }
      toggleLayer(l.id);
    };
    rows.appendChild(row);
    if (isOrgans && state.treeOpen) organRows(rows);
  });
}

/* organs: the tree, any depth. An eye takes a node out of its parent; a chevron opens what is
   inside, so the next level down can be reached. */
function countUnder(n) {
  let c = organParts.filter(p => sexOn(p.sex) && p.node === n).length;
  n.kids.forEach(k => { c += countUnder(k); });
  return c;
}

function organRows(rows) {
  const render = (list, depth) => {
    list.forEach(n => {
      if (!countUnder(n)) return;                     // nothing under it for this sex
      const out = state.nodeOut.has(n.id);
      const open = state.openGroups.has(n.id);
      // a leaf group still has meshes inside: the chevron has to open those, not just subgroups
      const own = organParts.filter(p => p.node === n && sexOn(p.sex)).length;
      const hasInside = own > 0 || n.kids.some(k => countUnder(k) > 0);
      const row = document.createElement("div");
      row.className = "row kids group" + (out ? " out" : "");
      row.dataset.organ = n.id;
      row.style.paddingLeft = (8 + (depth - 1) * 11) + "px";
      row.innerHTML =
        `<button class="chev${hasInside ? "" : " blank"}" title="show what is inside">${hasInside ? (open ? "\u25be" : "\u25b8") : ""}</button>` +
        `<span class="dot" style="background:#${n.color.toString(16).padStart(6, "0")}"></span>` +
        `<span class="nm" title="${n.label}">${n.label}</span>` +
        `<span class="cnt">${countUnder(n)}</span>` +
        `<button class="eye" title="${out ? "put it back" : "take it out"}">${out ? EYE_OPEN : EYE_SHUT}</button>`;
      row.onclick = e => {
        if (e.target.closest(".chev")) {
          if (!hasInside) return;
          if (open) state.openGroups.delete(n.id); else state.openGroups.add(n.id);
          buildLegend();
          return;
        }
        toggleKey(n.id);
      };
      rows.appendChild(row);
      if (open) {
        if (n.kids.length) render(n.kids, depth + 1);
        organParts.filter(p => p.node === n && sexOn(p.sex))
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach(p => rows.appendChild(meshRow(p)));
      }
    });
  };
  render(ORGAN_TREE, 1);
}

function meshRow(p) {
  const key = meshKey(p.name);
  const isOut = state.nodeOut.has(key);
  const row = document.createElement("div");
  row.className = "row kids part" + (isOut ? " out" : "");
  row.dataset.organ = p.name;
  const col = p.mesh.material && p.mesh.material.color ? p.mesh.material.color.getHex() : 0xc78fb0;
  row.innerHTML = `<span class="chev blank"></span>` +
    `<span class="dot" style="background:#${col.toString(16).padStart(6, "0")}"></span>` +
    `<span class="nm" title="${p.name}">${partLabel(p.name)}</span>` +
    `<button class="eye" title="${isOut ? "put it back into its group" : "take it out as a node"}">${isOut ? EYE_OPEN : EYE_SHUT}</button>`;
  row.onclick = () => toggleKey(key);
  return row;
}

function partLabel(name) {
  return name.replace(/\.?001$/, "").replace(/_/g, " ");
}

/* ---------- the node panel: what the node under the cursor actually is ---------- */
let selMats = [];

function clearHighlight() {
  selMats.forEach(([m, c, i]) => { m.emissive.copy(c); m.emissiveIntensity = i; });
  selMats = [];
}

function highlight(obj) {
  clearHighlight();
  const seen = new Set();
  obj.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.emissive || seen.has(o.material)) return;
    seen.add(o.material);
    selMats.push([o.material, o.material.emissive.clone(), o.material.emissiveIntensity]);
    o.material.emissive.setHex(0x1d3448);
    o.material.emissiveIntensity = 0.35;
  });
}

function selectedObject() {
  if (!state.sel) return null;
  if (state.sel === "organs") return organGhost;
  const n = organNodes.find(o => o.meta.id === state.sel);
  if (n) return n.node;
  return groups[state.sel] || null;
}

function select(id) {
  const before = state.sel;
  state.sel = id || null;
  const selChanged = before !== state.sel;
  const panel = document.getElementById("node");
  if (!state.sel) {
    panel.hidden = true; clearHighlight();
    if (selChanged) camKey = "";          // back to the overview the layout would have framed
    layout();
    return;
  }

  /* a single mesh that left its group */
  if (typeof id === "string" && isMeshKey(id)) {
    const p = partByKey(id);
    if (!p) { panel.hidden = true; return; }
    panel.hidden = false;
    document.getElementById("npTitle").textContent = partLabel(p.name);
    document.getElementById("npSub").textContent = `part of ${p.node.label} · 1 mesh`;
    document.getElementById("npDesc").textContent =
      `One structure of ${p.node.label}, standing on its own with an edge back to it. The eye in the list puts it inside again.`;
    const acts = document.getElementById("npActs");
    acts.innerHTML = "";
    const b = document.createElement("button");
    b.textContent = "put it back into " + p.node.label;
    b.classList.add("on");
    b.onclick = () => { toggleKey(id); select(null); };
    acts.appendChild(b);
    const obj = selectedObject();
    if (obj) highlight(obj); else clearHighlight();
    layout();
    if (selChanged) focusOn(objectForSel(id));
    return;
  }

  const org = NODE_BY_ID[id] || null;
  const lay = LAYERS.find(l => l.id === id);
  const meta = org || lay;
  if (!meta) { panel.hidden = true; clearHighlight(); return; }

  const parts = org ? countUnder(org) : 0;
  const sub = org ? `${org.depth === 1 ? "system" : org.depth === 2 ? "organ" : "part of the tree"} · ${parts} ${parts === 1 ? "mesh" : "meshes"}`
            : id === "organs" ? `set · ${new Set(organParts.filter(p => sexOn(p.sex)).map(p => p.gid)).size} groups`
            : `layer · ${layerCount(meta)} ${layerCount(meta) === 1 ? "mesh" : "meshes"}`;

  document.getElementById("npTitle").textContent = org ? org.label : meta.name;
  document.getElementById("npSub").textContent = sub;
  document.getElementById("npDesc").textContent = meta.about || "";

  const acts = document.getElementById("npActs");
  acts.innerHTML = "";
  const add = (text, fn, primary) => {
    const b = document.createElement("button");
    b.textContent = text;
    if (primary) b.classList.add("on");
    b.onclick = () => { fn(); select(state.sel); };
    acts.appendChild(b);
  };
  if (org) {
    const isOut = state.nodeOut.has(id);
    const where = org.parent ? org.parent.label : "the set";
    add(isOut ? `put it back into ${where}` : `take it out of ${where}`, () => toggleKey(id), isOut);
    if (org.kids.length) {
      add("take everything inside out", () => setOutDeep(id, true));
      add("put everything inside back", () => setOutDeep(id, false));
    }
  } else if (id === "organs") {
    add(state.organsOut ? "merge into one node" : "split into systems", () => {
      if (state.organsOut) { state.nodeOut.clear(); syncTree(); }
      else openAll();
      layout(); buildLegend();
    }, true);
    add(state.out.has("organs") ? "put the set back into the body" : "take the set out of the body", () => toggleLayer("organs"));
  } else {
    add(state.out.has(id) ? "put it back into the body" : "take it out of the body", () => toggleLayer(id), state.out.has(id));
  }

  panel.hidden = false;
  const obj = selectedObject();
  if (obj) highlight(obj); else clearHighlight();
  layout();
  if (selChanged) focusOn(objectForSel(id));
}

document.getElementById("nodeClose").onclick = () => select(null);

/* double-click any node to fly to it: the one gesture that answers 'zoom in on this organ' */
renderer.domElement.addEventListener("dblclick", e => {
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit) return;
  let obj = null;
  if (hit.groupId) { const n = organNodes.find(o => o.meta.id === hit.groupId); obj = n && n.node; }
  else if (hit.setId) obj = organGhost;
  else if (hit.layerId) obj = groups[hit.layerId];
  if (!obj) return;
  const b = new THREE.Box3().setFromObject(obj);
  if (b.isEmpty()) return;
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z, 0.08);
  camWant.target.copy(c);
  camWant.pos.copy(c).add(new THREE.Vector3(0, r * 0.35, r * 4.6));   // a frame, not a close-up
  camAnim = true;
  camUntil = performance.now() + 1400;
});

/* a body layer in or out of the body; the organs layer also opens and closes its tree */
function toggleLayer(id) {
  if (state.out.has(id)) state.out.delete(id); else state.out.add(id);
  if (id === "organs") {
    state.treeOpen = state.out.has("organs");     // show the rows at once — but open nothing
    if (!state.out.has("organs")) state.nodeOut.clear();
  }
  syncOrgans();
  layout();
  buildLegend();
  if (state.sel === id) select(id);
}

/* every eye in the legend goes through here: take it out of its parent, or put it back */
function syncOrgans() { syncTree(); }

function openAll() {
  ORGAN_TREE.filter(n => countUnder(n) > 0).forEach(n => setOut(n.id, true));   // level one: the systems
  layout(); buildLegend();
}

function toggleGroup(id) { toggleKey(id); }
function togglePart(name) { toggleKey(meshKey(name)); }

/* The only place that decides what "female" means. A part without a sex is shared; a part with one
   is in the scene exactly when it matches state.sex. Everything else asks this, nothing else
   compares sexes by hand. */
function sexOn(sex) { return !sex || sex === state.sex; }

function variantCount(id, sex) {
  const g = groups[id];
  const v = g && g.userData.variants[sex];
  if (!v) return 0;
  let n = 0;
  v.traverse(o => { if (o.isMesh) n++; });
  return n;
}

function toggle(id) {
  if (state.hidden.has(id)) state.hidden.delete(id); else state.hidden.add(id);
  buildLegend();
  layout();
}

function applySex() {
  Object.values(groups).forEach(gr => {
    if (!gr || !gr.userData.variants) return;
    Object.entries(gr.userData.variants).forEach(([sex, obj]) => {
      const on = sexOn(sex);
      obj.visible = on;
      obj.traverse(o => { o.visible = on; });
    });
  });
  // the organs set carries both tracts as variants; every part knows which sex it belongs to
  organParts.forEach(p => { p.mesh.visible = partShown(p); });
  bodyHeadCut();
  if (organGhost) { organGhost.removeFromParent(); organGhost = null; }   // rebuild for the new sex
  makeGhost().visible = state.organsOut;
  const anyBodyOut = LAYERS.some(l => l.id !== "organs" && state.out.has(l.id));
  if (bodyGhost || anyBodyOut) { makeBodyGhost(); if (bodyGhost) bodyGhost.visible = anyBodyOut; }
  // teeth and nails show on both sexes; the hair cap was stripped from the model (strip_hair.py)
  document.querySelectorAll("#sex button").forEach(b => b.classList.toggle("on", b.dataset.sex === state.sex));
  if (state.sel) select(state.sel);
  document.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.layer;
    const gr = groups[id];
    if (gr && gr.userData.variants && gr.userData.variants[state.sex]) {
      let n = 0;
      gr.userData.variants[state.sex].traverse(o => { if (o.isMesh) n++; });
      const c = row.querySelector(".cnt");
      if (c) c.textContent = n;
    }
  });
  const organCounter = document.querySelector('.row[data-layer="organs"] .cnt');
  if (organCounter) organCounter.textContent = availableOrganCount();
  document.getElementById("foot").textContent =
    state.sex === "male" ? "male — the atlas body and its 12 reproductive organs"
      : "female — rebuilt tract · 18 separate structures · CC0 surface";
}

function fitDistance(w, h) {
  const v = camera.fov * Math.PI / 180;
  return Math.max((h/2)/Math.tan(v/2), (w/2)/Math.tan(v/2)/camera.aspect) * 1.12;
}

/* parents, depths and an index, so anything can find its way up the tree */
const NODE_BY_ID = {};
(function indexTree(list, parent, depth) {
  list.forEach(n => {
    n.parent = parent; n.depth = depth; n.kids = n.children || [];
    if (n.color === undefined) n.color = parent ? parent.color : 0x9a9aa8;   // a child wears its parent's colour
    if (n.about === undefined && parent) n.about = parent.about;
    NODE_BY_ID[n.id] = n;
    indexTree(n.kids, n, depth + 1);
  });
})(ORGAN_TREE, null, 1);

/* the deepest node whose test takes the name: lungs beat "other", a lobe beats its lung */
function classify(name) {
  const clean = name.replace(/\.?001$/, "").replace(/_/g, " ");
  let hit = null;
  (function walk(list) {
    for (const n of list) {
      if (n.kids.length && walk(n.kids)) return true;
      if (n.test && n.test(clean)) { hit = n; return true; }
    }
    return false;
  })(ORGAN_TREE);
  return hit;
}

function partLabel(name) {
  return name.replace(/\.?001$/, "").replace(/_/g, " ");
}

/* a mesh that left its group: its key is its name, so one set holds every level alike */
function meshKey(name) { return "m:" + name; }
function isMeshKey(key) { return key.startsWith("m:"); }

function partByKey(key) {
  const name = key.slice(2);
  return organParts.find(p => p.name === name);
}

/* one place that decides what is out and what that implies */
function syncTree() {
  let again = true;
  while (again) {
    again = false;
    [...state.nodeOut].forEach(k => {
      let ok = true;
      if (isMeshKey(k)) {
        const p = partByKey(k);
        ok = !!p && sexOn(p.sex) && state.nodeOut.has(p.node.id);
      } else {
        const n = NODE_BY_ID[k];
        ok = !!n && (!n.parent || state.nodeOut.has(n.parent.id));
      }
      if (!ok) { state.nodeOut.delete(k); again = true; }
    });
  }
  if (!state.out.has("organs")) state.nodeOut.clear();
  state.organsOut = state.out.has("organs") && [...state.nodeOut].some(k => !isMeshKey(k));
  organParts.forEach(p => { if (!isMeshKey(meshKey(p.name))) p.mesh.visible = sexOn(p.sex); });
}

function setOut(key, out) {
  if (out) {
    state.nodeOut.add(key);
    const p = isMeshKey(key) ? partByKey(key) : null;
    let n = p ? p.node : NODE_BY_ID[key];
    while (n) { state.nodeOut.add(n.id); n = n.parent; }
    if (!state.out.has("organs")) state.out.add("organs");
    state.treeOpen = true;
    if (p) state.openGroups.add(p.node.id);
  } else {
    state.nodeOut.delete(key);
  }
  syncTree();
  layout();
  buildLegend();
  if (state.sel) select(state.sel);
}

function toggleKey(key) { setOut(key, !state.nodeOut.has(key)); }

/* everything below a node comes out with it (the set's 'split into organs' and a row's own action) */
function setOutDeep(id, out) {
  const n = NODE_BY_ID[id];
  if (!n) return;
  if (out) {
    setOut(id, true);
    n.kids.forEach(k => setOut(k.id, true));       // one level down: the organs, not their parts
  } else {
    (function close(node) {
      node.kids.forEach(k => { close(k); setOut(k.id, false); });
    })(n);
    setOut(id, false);
  }
}

/* the organ graph's own state: the nodes that are out, the root that holds them, and the edges */
let organRoot = null;
let organNodes = [];
let partNodes = [];
let edgePairs = [];
let organGhost = null;
let bodyGhost = null;

let organCentre = new THREE.Vector3(0, 0.15, 0);   // where the organs sit in the body
let organSize = new THREE.Vector3(0.3, 0.6, 0.25); // how big the set is

/* the organs set moves with its layer, so its centre is not fixed: it is the rest centre carried
   through the layer group's own transform */
function setCentre() {
  const t = targets.organs;
  if (!t) return organCentre.clone();
  return organCentre.clone().multiplyScalar(t.s).add(t.p);
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

function sexOf(obj) {
  for (let o = obj; o; o = o.parent) if (o.userData && o.userData.variant) return o.userData.variant;
  return null;
}

function partShown(p) {
  return sexOn(p.sex);
}

function collectOrgans() {
  organParts.length = 0;
  const g = groups.organs;
  if (!g) return;
  g.userData.inner.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const c = o.geometry.boundingBox.getCenter(new THREE.Vector3());
    const meta = classify(o.name) || NODE_BY_ID.other;
    // the atlas ships one urethra and it is his. Her tract files its own 2.6 cm one, so the atlas
    // tube is male-only — matched loosely, because the exporter renames it Urethra001
    const sex = sexOf(o) || (/^urethra\d*$/i.test(o.name) ? "male" : null);
    organParts.push({
      mesh: o, c, name: o.name, gid: meta.id, gmeta: meta, node: meta, sex,
      // where it sits in the set, untransformed: putting a node back must not move a single organ
      home: { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() }
    });
  });
  /* the organs set's own centre, in world space, at rest */
  const box = new THREE.Box3();
  g.updateMatrixWorld(true);
  organParts.forEach(p => box.expandByPoint(p.mesh.localToWorld(p.c.clone())));
  if (!box.isEmpty()) {
    organCentre = box.getCenter(new THREE.Vector3());
    organSize = box.getSize(new THREE.Vector3());
  }
  // the biggest organ, because a node is never shrunk below its true size any more
  const groupBox = {};
  organParts.forEach(p => {
    if (!sexOn(p.sex)) return;
    const s = p.mesh.geometry.boundingBox.getSize(new THREE.Vector3());
    let top = p.node; while (top && top.parent) top = top.parent;   // a whole system, not one leaf
    const b = groupBox[top.id] = groupBox[top.id] || new THREE.Box3();
    b.expandByPoint(p.c.clone().sub(s.clone().multiplyScalar(0.5)));
    b.expandByPoint(p.c.clone().add(s.clone().multiplyScalar(0.5)));
  });
  organMaxNode = 0.3;
  Object.values(groupBox).forEach(b => {
    const s = b.getSize(new THREE.Vector3());
    organMaxNode = Math.max(organMaxNode, s.x, s.y, s.z);
  });
  ORGAN_R = Math.max(0.9, organMaxNode * 1.6);   // a tight ring: nodes stay close and legible
}

function makeBodyGhost() {
  if (bodyGhost) { bodyGhost.removeFromParent(); bodyGhost = null; }
  const skinG = groups.skin;
  if (!skinG) return null;
  const keep = skinG.position.clone();
  skinG.position.set(0, 0, 0);
  skinG.updateMatrixWorld(true);
  const g = new THREE.Group();
  g.name = "bodyGhost";
  g.userData.nodeLabel = "body";
  skinG.traverse(o => {
    if (!o.isMesh) return;
    // the layer is usually hidden when this runs, so look at the variant, not at visibility:
    // a copy of the skin for this sex is exactly what the body cloud is
    let v = null;
    for (let p = o; p; p = p.parent) if (p.userData && p.userData.variant) { v = p.userData.variant; break; }
    if (!sexOn(v)) return;
    const base = o.material && o.material.color ? o.material.color.clone() : new THREE.Color(0xb9c6d4);
    const m = new THREE.Mesh(o.geometry, new THREE.MeshStandardMaterial({
      color: base, roughness: 0.9, metalness: 0, transparent: true, opacity: 0.34,
      depthWrite: false, side: THREE.DoubleSide
    }));
    m.userData.ghost = true;
    m.applyMatrix4(o.matrixWorld);
    m.raycast = () => {};          // a marker, not a target: the body behind it stays clickable
    g.add(m);
  });
  skinG.position.copy(keep);
  skinG.updateMatrixWorld(true);
  scene.add(g);
  bodyGhost = g;
  return g;
}

function objectForSel(key) {
  if (!key) return null;
  if (isMeshKey(key)) { const pn = partNodes.find(x => x.key === key); return pn ? pn.node : null; }
  const o = organNodes.find(x => x.key === key);
  if (o) return o.node;
  if (key === "organs") return organGhost;
  return groups[key] || null;
}

function focusOn(obj) {
  if (!obj) return;
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z, 0.05);
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0.15, 1);
  dir.normalize();
  const now = camera.position.distanceTo(controls.target);
  const d = Math.min(Math.max(now, r * 2.0), Math.max(r * 4.5, 0.9));
  camWant.target.copy(c);
  camWant.pos.copy(c).add(dir.multiplyScalar(d));
  camAnim = true;
  camUntil = performance.now() + 1200;
}

/* the organs set's own centre, in world space, at rest */

/* ---------- the graph: nodes are balls, and where they sit is computed, not drawn ----------
   A node is a sphere with its meshes shrunk inside it, so every node reads at the same weight
   whatever it holds: the lungs and the three immune organs are both one ball. Positions come from
   a spring/repulsion relaxation (edges pull, everything pushes), which spreads the tree through
   space and keeps nodes from landing on top of each other. */

const LEVEL_R = { 1: 0.30, 2: 0.21, 3: 0.145, 4: 0.10 };
function levelR(depth) { return LEVEL_R[Math.min(4, Math.max(1, depth))] || 0.06; }

/* the rows that are out, with their meshes assigned to the nearest open ancestor */
function graphRows() {
  const c = setCentre();
  const rows = [];
  (function walk(list, parentRow) {
    list.forEach(n => {
      if (!state.nodeOut.has(n.id) || !countUnder(n)) return;
      const row = { key: n.id, meta: n, parent: parentRow, depth: n.depth, parts: [], leaves: [], pos: new THREE.Vector3() };
      rows.push(row);
      walk(n.kids, row);
    });
  })(ORGAN_TREE, null);

  const rowByKey = new Map(rows.map(r => [r.key, r]));
  organParts.forEach(p => {
    if (!sexOn(p.sex)) return;
    let n = p.node;
    while (n && !state.nodeOut.has(n.id)) n = n.parent;
    const row = n && rowByKey.get(n.id);
    if (!row) return;
    if (state.nodeOut.has(meshKey(p.name))) row.leaves.push(p);
    else row.parts.push(p);
  });

  /* the tree is laid out radially: the systems on a sphere round the set, and any node that opens
     puts its children on a smaller sphere round itself. Siblings land on the Fibonacci spiral, so
     they never sit on top of each other and every edge runs outward from the node it belongs to. */
  /* A ring in a tilted plane, not a sphere: a sphere's back half projects onto its front half, so
     every node lands on the same few pixels. Tilted, the ring keeps real depth and still reads. */
  const placeRing = (list, centre, radius, seed) => {
    const n = new THREE.Vector3(0.30 + 0.10 * Math.sin(seed), 0.20 + 0.10 * Math.cos(seed * 1.7), 0.94).normalize();
    const u = new THREE.Vector3(1, 0, 0).projectOnPlane(n).normalize();
    const v = n.clone().cross(u).normalize();
    const N = list.length;
    list.forEach((r, i) => {
      const a = (i / Math.max(1, N)) * Math.PI * 2 + seed;
      if (N === 1) { r.pos.copy(centre).addScaledVector(u, radius); return; }
      r.pos.copy(centre).addScaledVector(u, Math.cos(a) * radius).addScaledVector(v, Math.sin(a) * radius);
    });
  };

  const roots = rows.filter(r => !r.parent);
  placeRing(roots, c, 1.16, 0.55);
  rows.forEach(r => {
    if (!r.parent) return;
    const kids = rows.filter(x => x.parent === r);
    const radius = r.depth === 1 ? 0.60 : r.depth === 2 ? 0.33 : 0.20;
    placeRing(kids, r.pos, radius, (hashStr(r.key) % 628) / 100);
  });

  /* a final sweep: nothing may sit inside anything else */
  const idx = rows.map(r => r.key);
  const P = new Map(rows.map(r => [r.key, r.pos.clone()]));
  for (let pass = 0; pass < 80; pass++) {
    let moved = false;
    for (let i = 0; i < idx.length; i++) {
      for (let j = i + 1; j < idx.length; j++) {
        const a = P.get(idx[i]), b = P.get(idx[j]);
        const need = (levelR(rows[i].depth) + levelR(rows[j].depth)) * 1.12 + 0.05;
        const d = a.clone().sub(b);
        let len = d.length();
        if (len < 1e-4) { d.set(0.31, 0.17, 0.47); len = d.length(); }
        if (len < need) {
          const push = d.multiplyScalar((need - len) * 0.5 / len);
          a.add(push); b.sub(push);
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  rows.forEach(r => r.pos = P.get(r.key));
  return { rows };
}


/* a soft radial haze: what the collapsed parent looked like in science-kg */
let CLOUD_TEX = null;
function cloudTexture() {
  if (CLOUD_TEX) return CLOUD_TEX;
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const grd = x.createRadialGradient(64, 64, 2, 64, 64, 64);
  grd.addColorStop(0.0, "rgba(255,255,255,0.55)");
  grd.addColorStop(0.35, "rgba(255,255,255,0.34)");
  grd.addColorStop(0.70, "rgba(255,255,255,0.10)");
  grd.addColorStop(1.0, "rgba(255,255,255,0)");
  x.fillStyle = grd;
  x.fillRect(0, 0, 128, 128);
  CLOUD_TEX = new THREE.CanvasTexture(c);
  CLOUD_TEX.needsUpdate = true;
  return CLOUD_TEX;
}

function makeCloud(color, R) {
  // three stacked hazes read as a volume; one sprite reads as a smudge
  const g = new THREE.Group();
  g.userData.cloud = true;
  [[1.00, 0.55], [0.82, 0.42], [0.64, 0.30]].forEach(([f, op], i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cloudTexture(), color, transparent: true, opacity: op, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending
    }));
    s.scale.setScalar((R || 0.2) * 3.2 * f);
    s.userData.cloudLayer = i;
    g.add(s);
  });
  g.scale.setScalar(1);
  return g;
}

function buildOrganNodes() {
  const { rows } = graphRows();
  const inner = groups.organs.userData.inner;
  if (!organRoot) { organRoot = new THREE.Group(); organRoot.name = "organGraph"; scene.add(organRoot); }

  const wanted = new Set(rows.map(r => r.key));
  organNodes = organNodes.filter(o => {
    if (wanted.has(o.key)) return true;
    o.parts.forEach(p => {
      inner.add(p.mesh);
      p.mesh.position.copy(p.home.p); p.mesh.quaternion.copy(p.home.q); p.mesh.scale.copy(p.home.s);
    });
    o.node.removeFromParent();
    return false;
  });

  rows.forEach(row => {
    let o = organNodes.find(x => x.key === row.key);
    if (!o) {
      const g = new THREE.Group();
      g.userData.nodeLabel = row.meta.label;
      g.userData.groupId = row.meta.id;
      g.userData.depth = row.depth;
      const R = levelR(row.depth);
      g.userData.radius = R;
      // the node itself: a ball you can see and click, with room inside for whatever it holds
      // unlit on purpose: the ball is a coloured shell, and its colour must read the same at any angle
      // the cloud: a soft haze, not a plastic sphere. Its organs float inside it.
      const cloud = makeCloud(row.meta.color, R);
      g.add(cloud);

      const holder = new THREE.Group();
      holder.userData.holder = true;
      g.add(holder);
      g.position.copy(row.pos);
      organRoot.add(g);
      o = { key: row.key, node: g, parts: [], meta: row.meta };
      organNodes.push(o);
    }
    const g = o.node;
    const holder = g.children.find(c => c.userData.holder);
    g.userData.nodeLabel = row.meta.label;
    g.userData.groupId = row.meta.id;
    const R = g.userData.radius;

    const meshes = row.parts.filter(p => !state.nodeOut.has(meshKey(p.name)));
    meshes.forEach(p => holder.attach(p.mesh));

    holder.scale.setScalar(1);
    holder.position.set(0, 0, 0);
    holder.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(holder);
    let scattered = false;
    if (!box.isEmpty()) {
      const s = box.getSize(new THREE.Vector3());
      const cw = box.getCenter(new THREE.Vector3());
      /* A sphere is only for a group whose pieces are islands — the spleen, thymus and tonsils are
         nowhere near each other, so without a shell they read as three specks. A lung, a liver or a
         bronchial tree are already one shape: they are drawn as themselves, at their own size. */
      // the tree says so: a group marked `cloud` is a set of islands with no shape of its own
      scattered = row.meta.cloud === true;
      if (!scattered) {
        const k = (R * 1.75) / Math.max(1e-4, Math.max(s.x, s.y, s.z));
        holder.scale.setScalar(k);
        const cl = g.worldToLocal(cw.clone());
        holder.position.copy(cl.multiplyScalar(-k));
      }
    }
    if (scattered && meshes.length) {
      /* a cloud is not a doll's house: the organs keep their own size and orbit the centre, so the
         spleen is a spleen and not a speck */
      holder.updateMatrixWorld(true);
      const all = new THREE.Box3();
      meshes.forEach(p => all.expandByObject(p.mesh));
      const c0 = all.getCenter(new THREE.Vector3());
      const cloudR = R * 1.5;
      const N = meshes.length;
      meshes.forEach((p, i) => {
        const bb = new THREE.Box3().setFromObject(p.mesh);
        const sz = bb.getSize(new THREE.Vector3());
        const want = Math.max(0.15, Math.min(3, (cloudR * 0.34) / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z))));
        p.mesh.scale.multiplyScalar(want);
        p.mesh.updateMatrixWorld(true);
        const bb2 = new THREE.Box3().setFromObject(p.mesh);
        const c2 = bb2.getCenter(new THREE.Vector3());
        // even stations on a spiral, not their places in the body: inside a cloud they are decoration
        const y = N === 1 ? 0 : 1 - (i / (N - 1)) * 2;
        const rad = Math.sqrt(Math.max(0, 1 - y * y));
        const th = i * 2.399963;
        const dir = new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad);
        if (dir.lengthSq() < 1e-6) dir.set(0.4, 0.5, 0.6);
        dir.normalize();
        const target = row.pos.clone().add(dir.multiplyScalar(cloudR * (N === 1 ? 0 : 0.60)));
        p.mesh.position.add(target.sub(c2));
      });
    }

    const cloud = g.children.find(c => c.userData.cloud);
    if (cloud) {
      cloud.visible = scattered;                       // only a group marked `cloud`
      cloud.children.forEach((s, i) => {
        s.material.color.setHex(row.meta.color);
      });
    }
    // the cloud is the node: a sphere the rays can hit, so clicking the haze selects it
    let pick = g.children.find(c => c.userData.pickSphere);
    if (!pick) {
      pick = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      pick.userData.pickSphere = true;
      g.add(pick);
    }
    pick.visible = scattered;
    pick.scale.setScalar(scattered ? R * 1.45 : R);
    pick.userData.groupId = row.meta.id;
    g.userData.scattered = scattered;

    g.userData.cLocal = new THREE.Vector3(0, 0, 0);
    g.userData.wantPos = row.pos.clone();
    g.userData.wantScale = 1;
    o.parts = row.parts;
    o.target = row.pos;
    o.parentKey = row.parent ? row.parent.key : null;
  });

  /* a single mesh that left its group is a small node of its own, same idea one size down */
  const leafRows = [];
  rows.forEach(row => row.leaves.forEach(p => leafRows.push({ part: p, parent: row })));
  const wantedLeaves = new Set(leafRows.map(l => meshKey(l.part.name)));
  partNodes = partNodes.filter(pn => {
    if (wantedLeaves.has(pn.key)) return true;
    inner.add(pn.part.mesh);
    pn.part.mesh.position.copy(pn.part.home.p); pn.part.mesh.quaternion.copy(pn.part.home.q); pn.part.mesh.scale.copy(pn.part.home.s);
    pn.node.removeFromParent();
    return false;
  });

  const byParent = new Map();
  leafRows.forEach(l => {
    if (!byParent.has(l.parent)) byParent.set(l.parent, []);
    byParent.get(l.parent).push(l);
  });
  byParent.forEach((list, parentRow) => {
    const N = list.length;
    list.forEach((l, i) => {
      const h = hashStr(l.part.name + i);
      const u = new THREE.Vector3(((h % 97) / 97) - 0.5, (((h >> 7) % 89) / 89) - 0.5, (((h >> 13) % 83) / 83) - 0.5).normalize();
      const t = parentRow.pos.clone().add(u.multiplyScalar(levelR(parentRow.depth) * 3.2));
      let pn = partNodes.find(x => x.key === meshKey(l.part.name));
      if (!pn) {
        const g = new THREE.Group();
        g.userData.partName = l.part.name;
        g.userData.nodeLabel = partLabel(l.part.name);
        g.userData.groupId = parentRow.meta.id;
        const R = 0.085;
        g.userData.radius = R;
        const ball = new THREE.Mesh(new THREE.SphereGeometry(R, 20, 14),
          new THREE.MeshStandardMaterial({ color: parentRow.meta.color, roughness: 0.45,
            transparent: true, opacity: 0.34, depthWrite: false }));
        ball.userData.ball = true;
        g.add(ball);
        const holder = new THREE.Group(); holder.userData.holder = true; g.add(holder);
        g.position.copy(t);
        organRoot.add(g);
        pn = { key: meshKey(l.part.name), node: g, part: l.part, parent: parentRow };
        partNodes.push(pn);
      }
      const g = pn.node;
      const holder = g.children.find(c => c.userData.holder);
      if (l.part.mesh.parent !== holder) holder.attach(l.part.mesh);
      holder.scale.setScalar(1); holder.position.set(0, 0, 0);
      holder.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(holder);
      if (!box.isEmpty()) {
        const s = box.getSize(new THREE.Vector3());
        const cw = box.getCenter(new THREE.Vector3());
        const k = (0.085 * 0.8) / Math.max(1e-4, Math.max(s.x, s.y, s.z));
        holder.scale.setScalar(k);
        holder.position.copy(g.worldToLocal(cw.clone()).multiplyScalar(-k));
      }
      pn.parent = parentRow;
      pn.target = t;
      g.userData.wantPos = t.clone();
      g.userData.wantScale = 1;
      g.userData.cLocal = new THREE.Vector3(0, 0, 0);
    });
  });

  /* the set itself is a semi-transparent copy of the whole organ model, standing at the centre the
     expanded organs radiate from — never inside the body, never a dot */
  const ghost = makeGhost();
  if (ghost.parent !== organRoot) organRoot.add(ghost);
  ghost.position.copy(setCentre());
  ghost.visible = organNodes.length > 0;     // only when the set really is split: after a merge the real organs are the set

  edgePairs = organNodes.map(o => ({
    a: o.node,
    b: o.parentKey ? (organNodes.find(x => x.key === o.parentKey) || {}).node || null : null
  }));
  partNodes.forEach(pn => edgePairs.push({ a: pn.node, b: pn.parent.node }));
  ensureEdges();
}

function disposeOrganNodes() {
  const inner = groups.organs.userData.inner;
  partNodes.forEach(pn => {
    inner.add(pn.part.mesh);
    pn.part.mesh.position.copy(pn.part.home.p); pn.part.mesh.quaternion.copy(pn.part.home.q); pn.part.mesh.scale.copy(pn.part.home.s);
    pn.node.removeFromParent();
  });
  partNodes = [];
  organNodes.forEach(o => {
    o.parts.forEach(p => {
      if (p.mesh.parent === inner) return;
      inner.attach(p.mesh);
      p.mesh.position.set(0, 0, 0); p.mesh.scale.setScalar(1); p.mesh.quaternion.set(0, 0, 0, 1);
    });
    o.node.removeFromParent();
  });
  organNodes = [];
  edgePairs = [];
  if (organRoot) { organRoot.removeFromParent(); organRoot = null; }
  if (edges) { scene.remove(edges); edges.geometry.dispose(); edges = null; }
}

function ensureEdges() {
  if (edges) {
    const need = edgePairs.length * 6;
    if (edges.geometry.attributes.position.array.length !== need) {
      scene.remove(edges); edges.geometry.dispose(); edges = null;
    } else return;
  }
  if (!edgePairs.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(edgePairs.length * 6), 3));
  edges = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x6b5a78, transparent: true, opacity: 0.5, depthWrite: false
  }));
  scene.add(edges);
}

function updateEdges() {
  if (!edges) return;
  const arr = edges.geometry.attributes.position.array;
  const set = setCentre();
  edgePairs.forEach((e, i) => {
    e.a.updateMatrixWorld(true);
    const a = e.a.localToWorld(e.a.userData.cLocal.clone());
    let b = set;
    if (e.b) { e.b.updateMatrixWorld(true); b = e.b.localToWorld(e.b.userData.cLocal.clone()); }
    arr[i * 6] = a.x; arr[i * 6 + 1] = a.y; arr[i * 6 + 2] = a.z;
    arr[i * 6 + 3] = b.x; arr[i * 6 + 4] = b.y; arr[i * 6 + 5] = b.z;
  });
  edges.geometry.attributes.position.needsUpdate = true;
  edges.geometry.computeBoundingSphere();
}

function makeGhost() {
  if (organGhost) return organGhost;
  const inner = groups.organs.userData.inner;
  organGhost = new THREE.Group();
  organGhost.name = "organGhost";
  organGhost.userData.nodeLabel = "all organs";
  organGhost.userData.setId = "organs";
  organParts.filter(p => sexOn(p.sex)).forEach(p => {
    const base = p.mesh.material && p.mesh.material.color ? p.mesh.material.color.clone() : new THREE.Color(0xc8a8c0);
    const m = new THREE.Mesh(p.mesh.geometry, new THREE.MeshStandardMaterial({
      color: base, roughness: 0.85, metalness: 0,
      transparent: true, opacity: 0.26, depthWrite: false, side: THREE.DoubleSide
    }));
    // the geometry is already in body coordinates: identity transform, wherever the real organ is now
    m.userData.kind = "organSet";
    m.userData.ghost = true;
    organGhost.add(m);
  });
  /* the geometry sits in body coordinates, so the copy is re-centred on its own origin: this node
     stands where the expansion radiates from, not where the organs sit in the body */
  organGhost.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  organGhost.children.forEach(m => bb.expandByObject(m));
  if (!bb.isEmpty()) {
    const cc = bb.getCenter(new THREE.Vector3());
    organGhost.children.forEach(m => m.position.sub(cc));
  }
  (organRoot || scene).add(organGhost);
  organGhost.position.copy(setCentre());
  return organGhost;
}

/* Her head is a different skull from the atlas one. The atlas muscles (the eyelids and lips
   especially), the teeth and the eyeballs sit for a male head, and at 45 % skin they read as four
   eyes, floating lashes and teeth through the lips. Inside her body those layers lose the head;
   taken out as nodes they keep all of it. */
let headCutMats = [];
let headCutMeshes = [];

/* Her head is a different skull from the atlas one: his muscles, teeth and eyeballs are bigger and
   stick out of her face. Cut the atlas layers at her jaw while they sit in the body; taken out as
   nodes they keep everything. The shell's head is drawn opaque (see paint()), so the gap never shows. */
function bodyHeadCut() {
  headCutMats.forEach(m => { m.clippingPlanes = null; m.needsUpdate = true; });
  headCutMats = [];
  headCutMeshes.forEach(o => { o.visible = true; });
  headCutMeshes = [];
  // only while her own shell is the head on screen: with the shell off, the atlas head is all there is
  if (state.sex !== "female" || state.out.has("skin")) return;
  ["muscles", "bones", "cardio", "nervous", "lymphoid"].forEach(id => {
    const g = groups[id];
    if (!g || state.out.has(id)) return;
    g.traverse(o => {
      if (!o.isMesh || !o.material) return;
      if (headCutMats.includes(o.material)) return;
      o.material.clippingPlanes = [headPlane];
      o.material.needsUpdate = true;
      headCutMats.push(o.material);
    });
  });
  organParts.forEach(p => {
    if (p.inNode) return;
    const b = new THREE.Box3().setFromObject(p.mesh);
    if (!b.isEmpty() && b.getCenter(new THREE.Vector3()).y > 0.585) {
      p.mesh.visible = false;
      headCutMeshes.push(p.mesh);
    }
  });
}

function layout() {
  if (!bodyBox) return;
  const width = bodyBox.getSize(new THREE.Vector3()).x;
  const graph = state.organsOut;

  // the organs set must be out before it can be split
  if (graph && !state.out.has("organs")) state.out.add("organs");

  // every layer that has been taken out takes a slot beside the body; the body itself never moves
  // and never loses a layer that is still collapsed
  const outList = LAYERS.filter(l => !l.graphOnly && state.out.has(l.id));
  const bodyOut = outList.filter(l => l.id !== "organs");
  const organsOut = state.out.has("organs");

  // the body layers take turns left and right of the body, each one clear of the last and all on
  // one horizontal level: the body stays at the centre, marked by the faint copy of the skin
  // the layers go round the body on one level: one in front, one behind, one on each flank and the
  // diagonals between — a ring in the horizontal plane, the body at its centre
  const gapX = width * 0.30, slot = {};
  const widest = bodyOut.reduce((m, l) => Math.max(m, layerSize[l.id] ? layerSize[l.id].x : width), width);
  const ringR = Math.max(width * 3.4, (bodyOut.length * (widest + width * 0.55)) / (Math.PI * 2) * 1.3);
  let rc = width * 0.5, lc = -width * 0.5;
  if (bodyOut.length) { rc = ringR + widest * 0.55 + gapX; lc = -rc; }
  bodyOut.forEach((l, i) => {
    // half a step off the front: a layer standing dead in front of the body both hides it and
    // eats the click that was meant for the body
    const a = (i / bodyOut.length) * Math.PI * 2 + Math.PI / 3;
    slot[l.id] = { x: Math.cos(a) * ringR, z: Math.sin(a) * ringR };
  });
  if (organsOut) {
    // out has to be visible: the set leaves the body and stands beside it, far enough that the tree
    // that fans out around it never reaches back into the body
    slot.organs = { x: width * 0.5 + (graph ? ORGAN_R + 0.15 : 0) + organSize.x * 0.5 + width * 0.22, z: 0 };
  }

  LAYERS.forEach(l => {
    if (l.graphOnly) return;
    const t = targets[l.id];
    const s = slot[l.id];
    if (s) t.p.set(s.x, -(layerMid[l.id] ? layerMid[l.id].y : 0), s.z);
    else t.p.set(0, 0, 0);
    // the organs are what makes the body the body; with them out, the remainder is a node among
    // nodes, so it shrinks to roughly the size of the organs set
    t.s = (slot[l.id] === undefined && organsOut) ? bodyShrink() : 1;
  });

  if (graph) buildOrganNodes(); else disposeOrganNodes();
  const ghost = null;               // no copy in the body: a second set of organs reads as organs that never left

  // the body cloud: a copy of the skin, a little more opaque than the organs copy, so the layers
  // that left are visibly circling something
  if (bodyOut.length && !bodyGhost) makeBodyGhost();
  if (bodyGhost) bodyGhost.visible = bodyOut.length > 0;

  LAYERS.forEach(l => {
    const g = groups[l.id];
    if (!g) return;
    if (l.graphOnly) { g.visible = false; return; }
    const isOut = state.out.has(l.id);
    g.visible = true;          // the skin is a layer like any other: in the body, or a node.
  });
  organParts.forEach(p => { p.mesh.visible = partShown(p); });
  bodyHeadCut();

  const skinG = groups.skin;
  const skinOut = state.out.has("skin");
  if (skinG) skinG.traverse(o => {
    if (!o.isMesh || !o.material || o.material.userData.solidHead) return;
    o.material.transparent = !skinOut;
    o.material.opacity = skinOut ? 1 : SHELL_OPACITY;
    o.material.depthWrite = skinOut;
  });
  const mus = groups.muscles;
  if (mus) {
    const see = !state.out.has("muscles");       // collapsed in the body: let the inside show
    mus.traverse(o => { if (o.isMesh && o.material) { o.material.transparent = see; o.material.opacity = see ? 0.38 : 1; o.material.depthWrite = !see; } });
  }

  // what the camera frames: once the organs are split they are the work surface, and fitting the
  // whole ring plus the fan at once made every organ a speck. Splitting now flies to the fan; the
  // ring is still there, a zoom-out away
  let spanW, spanH, cx;
  if (graph) {
    // frame the body and the nodes that are out together: the body is the anchor that says what
    // left it, and framing the tree alone pushes the body behind the panel
    const c = setCentre();
    let rad = 0.4;
    organNodes.forEach(o => {
      const p = o.target || o.node.position;
      rad = Math.max(rad, p.distanceTo(c) + organMaxNode * 0.55 + 0.08);
    });
    partNodes.forEach(pn => {
      const p = pn.target || pn.node.position;
      rad = Math.max(rad, p.distanceTo(c) + PART_NODE_SIZE * 0.9);
    });
    let minX = c.x - rad, maxX = c.x + rad, minY = -rad, maxY = rad;
    if (bodyBox && !bodyBox.isEmpty()) {
      minX = Math.min(minX, bodyBox.min.x - 0.12); maxX = Math.max(maxX, bodyBox.max.x + 0.12);
      minY = Math.min(minY, bodyBox.min.y - 0.06); maxY = Math.max(maxY, bodyBox.max.y + 0.06);
    }
    spanW = Math.max(0.8, maxX - minX); spanH = Math.max(0.8, maxY - minY); cx = (minX + maxX) / 2;
  } else {
    const left = lc - width * 0.30;
    let right = rc + width * 0.30;
    if (organsOut) right = Math.max(right, slot.organs.x + (organSize.x / 2) * 1.2);
    spanW = Math.max(width * 1.1, right - left);
    spanH = 1.8;
    cx = (left + right) / 2;
  }
  // the panel sits over the canvas, so the scene is fitted into the strip to its right instead of
  // being centred on the window (which pushed the leftmost layer behind the panel)
  const panelL = state.collapsed ? 28 : 236, panelR = state.sel ? 320 : 0;
  const visW = Math.max(320, innerWidth - panelL - panelR);
  const grow = innerWidth / visW;
  const d = fitDistance(spanW * grow, spanH);
  const dx = ((panelL + visW / 2) / innerWidth - 0.5) * spanW * grow;
  // once the layers are on the ring the camera has to look slightly down, or a ring seen edge-on
  // is just a pile of overlapping bodies
  const elev = (!graph && bodyOut.length > 1) ? 0.45 : 0.06;
  // re-frame only when the scene itself changed: selecting a node, or the user having zoomed
  // somewhere, must not snap the view back to the overview
  // the selection is not part of this: opening the panel must not move the camera the user has
  // just zoomed
  const camKeyNow = [...state.out].sort().join("+") + "|" + [...state.nodeOut].sort().join(",") + "|" + graph + "|" + state.collapsed;
  if (camKeyNow !== camKey) {
    camKey = camKeyNow;
    camWant.pos.set(cx - dx, d * elev, d);
    camWant.target.set(cx - dx, 0, 0);
    camAnim = true;
    camUntil = performance.now() + 1400;
  }
}

function pickAt(x, y) {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObjects(scene.children, true);
  const shown = o => { let p = o; while (p) { if (!p.visible) return false; p = p.parent; } return true; };
  for (const h of hits) {
    if (!shown(h.object)) continue;
    let o = h.object, layerId = null, label = null, groupId = null, setId = null, partName = null;
    while (o) {
      if (o.userData && o.userData.partName) { partName = o.userData.partName; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.groupId) { groupId = o.userData.groupId; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.setId) { setId = o.userData.setId; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.layerId) { layerId = o.userData.layerId; break; }
      o = o.parent;
    }
    if (!label && layerId) {
      const l = LAYERS.find(x => x.id === layerId);
      label = l ? l.name : layerId;
    }
    if (label || layerId) return { layerId, label, groupId, setId, partName };
  }
  return null;
}

let downAt = null;
let hoverAt = 0;
renderer.domElement.addEventListener("pointermove", e => {
  const now = performance.now();
  if (now - hoverAt < 60) return;
  hoverAt = now;
  const tip = document.getElementById("tip");
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit || !hit.label) { tip.style.display = "none"; return; }
  tip.textContent = hit.label;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 16) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
renderer.domElement.addEventListener("pointerdown", e => {
  downAt = { x: e.clientX, y: e.clientY };
  camAnim = false;                       // the user takes the camera the moment they touch it
});
renderer.domElement.addEventListener("wheel", () => { camAnim = false; }, { passive: true });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;                       // that was an orbit drag, not a click
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit) { select(null); return; }                       // a click on empty space clears it
  if (hit.partName) { select(meshKey(hit.partName)); return; }   // a part node: show what it is
  if (hit.groupId) { select(hit.groupId); return; }        // an organ node: show what it is
  if (hit.setId) {                                          // the organs set: select it, say what it is
    select("organs");                                       // splitting is an explicit action in the panel
    return;
  }
  if (hit.layerId) {
    if (state.out.has(hit.layerId)) select(hit.layerId);   // an out layer is a node: select it
    else toggleLayer(hit.layerId);                          // one still in the body comes out
  }
});

document.querySelectorAll("#sex button").forEach(b => b.onclick = () => {
  state.sex = b.dataset.sex;
  applySex();
  layout();
  buildLegend();
});
document.getElementById("collapse").onclick = e => {
  state.collapsed = !state.collapsed;
  document.getElementById("legend").classList.toggle("collapsed", state.collapsed);
  e.currentTarget.textContent = state.collapsed ? "▶" : "◀";
  e.currentTarget.title = state.collapsed ? "expand" : "collapse";
};
addEventListener("keydown", e => {
  if (e.key === "Escape" && state.organsOut) { state.organsOut = false; layout(); buildLegend(); }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const a = 1 - Math.pow(0.001, dt);
  Object.values(groups).forEach(g => {
    const t = targets[g.name]; if (!t) return;
    g.position.lerp(t.p, a);
    g.scale.lerp(new THREE.Vector3(t.s,t.s,t.s), a);
  });
  if (partNodes.length) {
    partNodes.forEach(pn => {
      pn.node.position.lerp(pn.node.userData.wantPos, a);
      const s = pn.node.scale.x + (pn.node.userData.wantScale - pn.node.scale.x) * a;
      pn.node.scale.setScalar(s);
    });
  }
  if (organNodes.length) {
    const t = performance.now() / 1000;
    organNodes.forEach(o => {
      o.node.position.lerp(o.node.userData.wantPos, a);
      const s = o.node.scale.x + (o.node.userData.wantScale - o.node.scale.x) * a;
      o.node.scale.setScalar(s);
      if (o.node.userData.scattered) {
        const holder = o.node.children.find(c => c.userData.holder);
        if (holder) {
          holder.rotation.y += dt * 1.1;
          holder.position.y = Math.sin(t * 1.6 + o.node.position.x * 3) * 0.02;
        }
      }
    });
    updateEdges();
  }
  // the body cloud is the body's shadow, not a snapshot: it follows wherever the body is now
  if (bodyGhost && groups.muscles) {
    bodyGhost.position.copy(groups.muscles.position);
    bodyGhost.scale.copy(groups.muscles.scale);
  }
  if (camAnim) {
    camera.position.lerp(camWant.pos, a);
    controls.target.lerp(camWant.target, a);
    if (camera.position.distanceTo(camWant.pos) < 0.004 || performance.now() > camUntil) camAnim = false;
  }
  controls.update();
  renderer.render(scene, camera);
}
buildLegend();
tick();
boot();

window.__ready = () => pending === 0 && !!bodyBox && failedFiles.length === 0;
window.__loadErrors = () => failedFiles.slice();
window.__layer = id => toggleLayer(id);
window.__setSex = s => { state.sex = s; applySex(); };
window.__toggle = id => toggle(id);
window.__expand = () => { if (!state.out.has("organs")) state.out.add("organs"); openAll(); };
window.__organs = (v) => { state.organsOut = v === undefined ? !state.organsOut : !!v; state.treeOpen = state.organsOut; layout(); buildLegend(); };
window.__part = (name, v) => { togglePart(name); };
window.__organNames = () => organParts.map(p => p.name);
window.__groups = () => organNodes.map(g => g.meta.id + ":" + g.parts.length);
window.__group = (id, v) => { setOut(id, !!v); };
window.__edgeCount = () => (edges ? edges.geometry.attributes.position.count / 2 : 0);
window.__nodeCount = () => organNodes.length;
window.__setSkin = () => layout();   // kept for the test scripts; the shell is always on now
window.__collapse = () => document.getElementById("collapse").click();
</script>
</body>
</html>
