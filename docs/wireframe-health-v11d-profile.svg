  <line x1="870" y1="394" x2="1416" y2="394" class="line"/>

  <circle cx="854" cy="416" r="7" class="badge"/><text x="854" y="419" class="num" text-anchor="middle">22</text>
  <text x="870" y="420" class="tm">RECOMMENDED ON THIS DATE</text>
  <g class="ts">
    <text x="870" y="442">start a statin · source: ESC 2021</text>
    <text x="1416" y="442" text-anchor="end">since 2021</text>
    <text x="870" y="462">colonoscopy · source: USPSTF</text>
    <text x="1416" y="462" text-anchor="end">since 2023</text>
