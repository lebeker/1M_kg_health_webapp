/* parents, depths and an index, so anything can find its way up the tree */
const NODE_BY_ID = {};
function indexTree(list, parent, depth) {
  list.forEach(n => {
    n.parent = parent;
    n.depth = depth;
    if (!n.kids) n.kids = n.children || [];      // the literal says `children`; the rest of the code says `kids`
    n.children = n.kids;
    if (n.color === undefined) n.color = parent ? parent.color : 0x9a9aa8;
    if (n.about === undefined && parent) n.about = parent.about;
    NODE_BY_ID[n.id] = n;
    if (n.kids.length) indexTree(n.kids, n, depth + 1);
  });
}
indexTree(ORGAN_TREE, null, 1);

/* A gland marked `into` does not live in its system: it moves under the anatomy it sits in, as a
   child group of its own, so it can be listed, opened and put back like any other organ. */
(function relocateGlands() {
  const moves = [];
  (function walk(list) {
    list.forEach(n => {
      if (n.into) moves.push(n);
      if (n.kids) walk(n.kids);
    });
  })(ORGAN_TREE);
  moves.forEach(n => {
    const from = n.parent, to = NODE_BY_ID[n.into];
    if (!to || !from) return;
    from.kids = from.kids.filter(k => k !== n);
    from.children = from.kids;
    to.kids = to.kids || [];
    to.children = to.kids;
    to.kids.push(n);
    n.system = from.id;                 // where it belongs, for the links
    n.into = null;
  });
  // parents and depths have all moved: re-index from the top
  indexTree(ORGAN_TREE, null, 1);
})();

/* (the single index above is the only one: a second walk would put a moved gland back) */

/* the deepest node whose test takes the name: lungs beat "other", a lobe beats its lung */
function classify(name) {
  const clean = name.replace(/\.?001$/, "").replace(/_/g, " ");
  let hit = null;
  (function walk(list) {
    for (const n of list) {
      if (n.kids.length && walk(n.kids)) return true;
      if (n.test && n.test(clean)) { hit = n; return true; }
    }
    return false;
  })(ORGAN_TREE);
  return hit;
}

function partLabel(name) {
  return name.replace(/\.?001$/, "").replace(/_/g, " ");
}

/* a mesh that left its group: its key is its name, so one set holds every level alike */
function meshKey(name) { return "m:" + name; }
function isMeshKey(key) { return key.startsWith("m:"); }

function partByKey(key) {
  const name = key.slice(2);
  return organParts.find(p => p.name === name);
}

/* one place that decides what is out and what that implies */
function syncTree() {
  let again = true;
  while (again) {
    again = false;
    [...state.nodeOut].forEach(k => {
      let ok = true;
      if (isMeshKey(k)) {
        const p = partByKey(k);
        ok = !!p && sexOn(p.sex) && state.nodeOut.has(p.node.id);
      } else {
        const n = NODE_BY_ID[k];
        ok = !!n && (!n.parent || state.nodeOut.has(n.parent.id));
      }
      if (!ok) { state.nodeOut.delete(k); again = true; }
    });
  }
  if (!state.out.has("organs")) state.nodeOut.clear();
  state.organsOut = state.out.has("organs") && [...state.nodeOut].some(k => !isMeshKey(k));
  organParts.forEach(p => { if (!isMeshKey(meshKey(p.name))) p.mesh.visible = sexOn(p.sex); });
}

function setOut(key, out) {
  if (out) {
    state.nodeOut.add(key);
    const p = isMeshKey(key) ? partByKey(key) : null;
    let n = p ? p.node : NODE_BY_ID[key];
    while (n) { state.nodeOut.add(n.id); n = n.parent; }
    if (!state.out.has("organs")) state.out.add("organs");
    state.treeOpen = true;
    if (p) state.openGroups.add(p.node.id);
  } else {
    state.nodeOut.delete(key);
  }
  syncTree();
  layout();
  syncOrgans();
  buildLegend();
  if (state.sel) select(state.sel);
}

function toggleKey(key) { setOut(key, !state.nodeOut.has(key)); }

/* everything below a node comes out with it (the set's 'split into organs' and a row's own action) */
function setOutDeep(id, out) {
  const n = NODE_BY_ID[id];
  if (!n) return;
  if (out) {
    setOut(id, true);
    n.kids.forEach(k => setOut(k.id, true));       // one level down: the organs, not their parts
  } else {
    (function close(node) {
      node.kids.forEach(k => { close(k); setOut(k.id, false); });
    })(n);
    setOut(id, false);
  }
}

/* the organ graph's own state: the nodes that are out, the root that holds them, and the edges */
let bodyProxy = null;
let organRoot = null;
let organNodes = [];
let partNodes = [];
let edgePairs = [];
let linkPairs = [];               // shadow system -> the node that hosts its organs
let organGhost = null;
let bodyGhost = null;

let organCentre = new THREE.Vector3(0, 0.15, 0);   // where the organs sit in the body
let organSize = new THREE.Vector3(0.3, 0.6, 0.25); // how big the set is

/* the organs set moves with its layer, so its centre is not fixed: it is the rest centre carried
   through the layer group's own transform */
function setCentre() {
  const t = targets.organs;
  if (!t) return organCentre.clone();
  return organCentre.clone().multiplyScalar(t.s).add(t.p);
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

function sexOf(obj) {
  for (let o = obj; o; o = o.parent) if (o.userData && o.userData.variant) return o.userData.variant;
  return null;
}

function partShown(p) {
  return sexOn(p.sex);
}

function collectOrgans() {
  organParts.length = 0;
  const g = groups.organs;
  if (!g) return;
  g.userData.inner.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const c = o.geometry.boundingBox.getCenter(new THREE.Vector3());
    const hit = classify(o.name) || NODE_BY_ID.other;
    // `into` sends a gland to the anatomy it lives with, but the part still remembers where it came from
    const meta = (hit.into && NODE_BY_ID[hit.into]) || hit;
    // the atlas ships one urethra and it is his. Her tract files its own 2.6 cm one, so the atlas
    // tube is male-only — matched loosely, because the exporter renames it Urethra001
    const sex = sexOf(o) || (/^urethra\d*$/i.test(o.name) ? "male" : null);
    organParts.push({
      mesh: o, c, name: o.name, gid: meta.id, gmeta: meta, node: meta, origin: hit, sex,
      // where it sits in the set, untransformed: putting a node back must not move a single organ
      home: { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() }
    });
  });
  /* the organs set's own centre, in world space, at rest */
  const box = new THREE.Box3();
  g.updateMatrixWorld(true);
  organParts.forEach(p => box.expandByPoint(p.mesh.localToWorld(p.c.clone())));
  if (!box.isEmpty()) {
    organCentre = box.getCenter(new THREE.Vector3());
    organSize = box.getSize(new THREE.Vector3());
  }
  // the biggest organ, because a node is never shrunk below its true size any more
  const groupBox = {};
  organParts.forEach(p => {
    if (!sexOn(p.sex)) return;
    const s = p.mesh.geometry.boundingBox.getSize(new THREE.Vector3());
    let top = p.node; while (top && top.parent) top = top.parent;   // a whole system, not one leaf
    const b = groupBox[top.id] = groupBox[top.id] || new THREE.Box3();
    b.expandByPoint(p.c.clone().sub(s.clone().multiplyScalar(0.5)));
    b.expandByPoint(p.c.clone().add(s.clone().multiplyScalar(0.5)));
  });
  organMaxNode = 0.3;
  Object.values(groupBox).forEach(b => {
    const s = b.getSize(new THREE.Vector3());
    organMaxNode = Math.max(organMaxNode, s.x, s.y, s.z);
  });
  ORGAN_R = Math.max(0.9, organMaxNode * 1.6);   // a tight ring: nodes stay close and legible
}

function makeBodyGhost() {
  if (bodyGhost) { bodyGhost.removeFromParent(); bodyGhost = null; }
  const skinG = groups.skin;
  if (!skinG) return null;
  const keep = skinG.position.clone();
  skinG.position.set(0, 0, 0);
  skinG.updateMatrixWorld(true);
  const g = new THREE.Group();
  g.name = "bodyGhost";
  g.userData.nodeLabel = "body";
  skinG.traverse(o => {
    if (!o.isMesh) return;
    // the layer is usually hidden when this runs, so look at the variant, not at visibility:
    // a copy of the skin for this sex is exactly what the body cloud is
    let v = null;
    for (let p = o; p; p = p.parent) if (p.userData && p.userData.variant) { v = p.userData.variant; break; }
    if (!sexOn(v)) return;
    const base = o.material && o.material.color ? o.material.color.clone() : new THREE.Color(0xb9c6d4);
    const m = new THREE.Mesh(o.geometry, new THREE.MeshStandardMaterial({
      color: base, roughness: 0.9, metalness: 0, transparent: true, opacity: 0.34,
      depthWrite: false, side: THREE.DoubleSide
    }));
    m.userData.ghost = true;
    m.applyMatrix4(o.matrixWorld);
    m.raycast = () => {};          // a marker, not a target: the body behind it stays clickable
    g.add(m);
  });
  skinG.position.copy(keep);
  skinG.updateMatrixWorld(true);
  scene.add(g);
  bodyGhost = g;
  return g;
}

function objectForSel(key) {
  if (!key) return null;
  if (isMeshKey(key)) { const pn = partNodes.find(x => x.key === key); return pn ? pn.node : null; }
  const o = organNodes.find(x => x.key === key);
  if (o) return o.node;
  if (key === "organs") return organGhost || groups.organs || null;
  if (key === "body") {
    if (!bodyProxy) {
      bodyProxy = new THREE.Group();
      bodyProxy.userData.nodeLabel = "body";
      const b = bodyBox || new THREE.Box3(new THREE.Vector3(-0.3, 0, -0.2), new THREE.Vector3(0.3, 1.8, 0.2));
      const sz = b.getSize(new THREE.Vector3()), ct = b.getCenter(new THREE.Vector3());
      const m = new THREE.Mesh(new THREE.BoxGeometry(sz.x, sz.y, sz.z), new THREE.MeshBasicMaterial({ visible: false }));
      m.position.copy(ct);
      bodyProxy.add(m);
      scene.add(bodyProxy);
    }
    return bodyProxy;
  }
  return groups[key] || null;
}

function focusOn(obj) {
  if (!obj) return;
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z, 0.05);
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0.15, 1);
  dir.normalize();
  const now = camera.position.distanceTo(controls.target);
  // never further than 6 units: the body is 1.8 tall, and a graph framed from 15 units is a postage stamp
  const d = Math.max(1.0, Math.min(Math.max(now, r * 2.0), Math.min(Math.max(r * 4.5, 1.0), 6.0)));
  camWant.target.copy(c);
  camWant.pos.copy(c).add(dir.multiplyScalar(d));
  camAnim = true;
  camUntil = performance.now() + 1200;
}

/* the organs set's own centre, in world space, at rest */

/* ---------- the graph: nodes are balls, and where they sit is computed, not drawn ----------
   A node is a sphere with its meshes shrunk inside it, so every node reads at the same weight
   whatever it holds: the lungs and the three immune organs are both one ball. Positions come from
   a spring/repulsion relaxation (edges pull, everything pushes), which spreads the tree through
   space and keeps nodes from landing on top of each other. */

const LEVEL_R = { 1: 0.30, 2: 0.21, 3: 0.15, 4: 0.10 };  // a node reads at a glance; the body is 1.8 tall
function levelR(depth) { return LEVEL_R[Math.min(4, Math.max(1, depth))] || 0.06; }

/* the rows that are out, with their meshes assigned to the nearest open ancestor */
function graphRows() {
  const c = setCentre();
  const rows = [];
  (function walk(list, parentRow) {
    list.forEach(n => {
      if (!state.nodeOut.has(n.id)) return;
      if (n.hidden || (!countUnder(n) && !n.shadow)) return;
      const row = { key: n.id, meta: n, parent: parentRow, depth: n.depth, parts: [], leaves: [], pos: new THREE.Vector3() };
      rows.push(row);
      walk(n.kids, row);
    });
  })(ORGAN_TREE, null);

  const rowByKey = new Map(rows.map(r => [r.key, r]));
  organParts.forEach(p => {
    if (!sexOn(p.sex)) return;
    let n = p.node;
    while (n && !state.nodeOut.has(n.id)) n = n.parent;
    const row = n && rowByKey.get(n.id);
    if (!row) return;
    if (state.nodeOut.has(meshKey(p.name))) row.leaves.push(p);
    else row.parts.push(p);
  });

  /* the tree is laid out radially: the systems on a sphere round the set, and any node that opens
     puts its children on a smaller sphere round itself. Siblings land on the Fibonacci spiral, so
     they never sit on top of each other and every edge runs outward from the node it belongs to. */
  /* d3-force-3d, ticked to convergence before anything is drawn. The dimensions are the SECOND
     argument to forceSimulation — `forceSimulation(nodes, 3)`. Calling .numDimensions(3) after the
     fact leaves every node's vz undefined, and the z axis turns to NaN on the first tick. */
  const BODY_X = 1.15;                                 // the body's right flank, plus a margin
  const simNodes = rows.map((r, i) => {
    const h = hashStr(r.key + i);
    return { id: r.key, row: r, r: levelR(r.depth),
      x: c.x + (((h % 101) / 101) - 0.5) * 1.8,
      y: c.y + ((((h >> 7) % 97) / 97) - 0.5) * 2.0,
      z: c.z + ((((h >> 13) % 89) / 89) - 0.5) * 1.8 };
  });
  const simById = new Map(simNodes.map(n => [n.id, n]));
  const simLinks = simNodes.filter(n => n.row.parent && simById.has(n.row.parent.key))
    .map(n => ({ source: simById.get(n.row.parent.key), target: n }));
  const sim = d3.forceSimulation(simNodes, 3)
    .force("link", d3.forceLink(simLinks).distance(l => l.source.r + l.target.r + 0.34).strength(0.7))
    .force("charge", d3.forceManyBody().strength(-0.055).distanceMax(4))
    .force("collide", d3.forceCollide().radius(n => n.r * 1.25).iterations(3))
    .stop();
  for (let i = 0; i < 420; i++) sim.tick();
  let cx = 0, cy = 0, cz = 0;
  simNodes.forEach(n => { cx += n.x; cy += n.y; cz += n.z; });
  cx /= simNodes.length || 1; cy /= simNodes.length || 1; cz /= simNodes.length || 1;
  simNodes.forEach(n => { n.x += c.x - cx; n.y += c.y - cy; n.z += c.z - cz; });

  /* Fit the solved graph to the space the camera actually gives it. A force cloud has no idea
     how big the screen is: six nodes can solve into a five-unit sprawl and half of them end up
     outside the viewport. Scale the whole solution to a fixed span, then stand it beside the body. */
  const bb = new THREE.Box3();
  simNodes.forEach(n => bb.expandByPoint(new THREE.Vector3(n.x, n.y, n.z)));
  const size = bb.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z);
  const k = span > 0.6 ? Math.min(2.0, Math.max(0.35, 2.2 / span)) : 1;
  const mid = bb.getCenter(new THREE.Vector3());
  simNodes.forEach(n => {
    n.x = BODY_X + 0.25 + (n.x - bb.min.x) * k;
    n.y = c.y + (n.y - mid.y) * k;
    n.z = c.z + (n.z - mid.z) * k;
    n.row.pos.set(n.x, n.y, n.z);
  });
  return { rows };
}


/* a soft radial haze: what the collapsed parent looked like in science-kg */
let CLOUD_TEX = null;
function cloudTexture() {
  if (CLOUD_TEX) return CLOUD_TEX;
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const grd = x.createRadialGradient(64, 64, 2, 64, 64, 64);
  grd.addColorStop(0.0, "rgba(255,255,255,0.55)");
  grd.addColorStop(0.35, "rgba(255,255,255,0.34)");
  grd.addColorStop(0.70, "rgba(255,255,255,0.10)");
  grd.addColorStop(1.0, "rgba(255,255,255,0)");
  x.fillStyle = grd;
  x.fillRect(0, 0, 128, 128);
  CLOUD_TEX = new THREE.CanvasTexture(c);
  CLOUD_TEX.needsUpdate = true;
  return CLOUD_TEX;
}

function makeCloud(color, R) {
  // three stacked hazes read as a volume; one sprite reads as a smudge
  const g = new THREE.Group();
  g.userData.cloud = true;
  [[1.00, 0.55], [0.82, 0.42], [0.64, 0.30]].forEach(([f, op], i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cloudTexture(), color, transparent: true, opacity: op, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending
    }));
    s.scale.setScalar((R || 0.2) * 3.2 * f);
    s.userData.cloudLayer = i;
    g.add(s);
  });
  g.scale.setScalar(1);
  return g;
}

function buildOrganNodes() {
  const had = organNodes.length;
  if (organNodes.length) disposeOrganNodes();     // every build starts clean: no stale holders
  const { rows } = graphRows();
  const inner = groups.organs.userData.inner;
  if (!organRoot) { organRoot = new THREE.Group(); organRoot.name = "organGraph"; scene.add(organRoot); }

  const wanted = new Set(rows.map(r => r.key));
  organNodes = organNodes.filter(o => {
    if (wanted.has(o.key)) return true;
    o.parts.forEach(p => {
      inner.add(p.mesh);
      p.mesh.position.copy(p.home.p); p.mesh.quaternion.copy(p.home.q); p.mesh.scale.copy(p.home.s);
      p.mesh.visible = true;
      if (p.mesh.material) { p.mesh.material.visible = true; p.mesh.material.transparent = false; p.mesh.material.opacity = 1; p.mesh.material.needsUpdate = true; }
    });
    o.node.removeFromParent();
    return false;
  });

  rows.forEach(row => {
    let o = organNodes.find(x => x.key === row.key);
    if (!o) {
      const g = new THREE.Group();
      g.userData.nodeLabel = row.meta.label;
      g.userData.groupId = row.meta.id;
      g.userData.depth = row.depth;
      const R = levelR(row.depth);
      g.userData.radius = R;
      // the node itself: a ball you can see and click, with room inside for whatever it holds
      // unlit on purpose: the ball is a coloured shell, and its colour must read the same at any angle
      // the cloud: a soft haze, not a plastic sphere. Its organs float inside it.
      const cloud = makeCloud(row.meta.color, R);
      g.add(cloud);

      const holder = new THREE.Group();
      holder.userData.holder = true;
      g.add(holder);
      g.position.copy(row.pos);
      organRoot.add(g);
      o = { key: row.key, node: g, parts: [], meta: row.meta };
      organNodes.push(o);
    }
    const g = o.node;
    const holder = g.children.find(c => c.userData.holder);
    g.userData.nodeLabel = row.meta.label;
    g.userData.groupId = row.meta.id;
    const R = g.userData.radius;

    const meshes = row.parts.filter(p => !state.nodeOut.has(meshKey(p.name)));
    meshes.forEach(p => {
      holder.attach(p.mesh);
      p.mesh.visible = true;
      if (p.mesh.material) {
        p.mesh.material.visible = true;
        if (p.mesh.material.transparent) { p.mesh.material.transparent = false; p.mesh.material.opacity = 1; p.mesh.material.needsUpdate = true; }
      }
      /* a node has to read as itself wherever it stands: the atlas materials are metal-heavy and
         go black outside the lights that were placed for the body, so a node six nodes away was
         "there" and invisible. Give every carried mesh a floor of its own colour. */
      const m = p.mesh.material;
      if (m && m.color) {
        m.metalness = 0;
        m.roughness = Math.min(0.85, m.roughness ?? 0.6);
        if (!m.emissive || m.emissive.getHex() === 0) m.emissive = m.color.clone().multiplyScalar(0.30);
      }
    });

    // whatever ended up in the holder is the node's body and must be drawn: a node whose meshes
    // were hidden by the layer-out pass had geometry and produced zero draw calls
    holder.traverse(m => {
      if (!m.isMesh) return;
      m.visible = true;
      if (m.material) { m.material.visible = true; if (m.material.transparent) { m.material.transparent = false; m.material.opacity = 1; m.material.needsUpdate = true; } }
    });

    holder.scale.setScalar(1);
    holder.position.set(0, 0, 0);
    holder.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(holder);
    let scattered = false;
    if (!box.isEmpty()) {
      const s = box.getSize(new THREE.Vector3());
      const cw = box.getCenter(new THREE.Vector3());
      /* A sphere is only for a group whose pieces are islands — the spleen, thymus and tonsils are
         nowhere near each other, so without a shell they read as three specks. A lung, a liver or a
         bronchial tree are already one shape: they are drawn as themselves, at their own size. */
      // the tree says so: a group marked `cloud` is a set of islands with no shape of its own
      scattered = row.meta.cloud === true;
      if (!scattered) {
        const k = (R * 1.75) / Math.max(1e-4, Math.max(s.x, s.y, s.z));
        holder.scale.setScalar(k);
        const cl = g.worldToLocal(cw.clone());
        holder.position.copy(cl.multiplyScalar(-k));
      }
    }
    if (scattered && meshes.length) {
      /* a cloud is not a doll's house: the organs keep their own size and orbit the centre, so the
         spleen is a spleen and not a speck */
      holder.updateMatrixWorld(true);
      const all = new THREE.Box3();
      meshes.forEach(p => all.expandByObject(p.mesh));
      const c0 = all.getCenter(new THREE.Vector3());
      const cloudR = R * 1.5;
      const N = meshes.length;
      meshes.forEach((p, i) => {
        const bb = new THREE.Box3().setFromObject(p.mesh);
        const sz = bb.getSize(new THREE.Vector3());
        const want = Math.max(0.15, Math.min(3, (cloudR * 0.34) / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z))));
        p.mesh.scale.multiplyScalar(want);
        p.mesh.updateMatrixWorld(true);
        const bb2 = new THREE.Box3().setFromObject(p.mesh);
        const c2 = bb2.getCenter(new THREE.Vector3());
        // even stations on a spiral, not their places in the body: inside a cloud they are decoration
        const y = N === 1 ? 0 : 1 - (i / (N - 1)) * 2;
        const rad = Math.sqrt(Math.max(0, 1 - y * y));
        const th = i * 2.399963;
        const dir = new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad);
        if (dir.lengthSq() < 1e-6) dir.set(0.4, 0.5, 0.6);
        dir.normalize();
        const target = row.pos.clone().add(dir.multiplyScalar(cloudR * (N === 1 ? 0 : 0.60)));
        // both are world points; the mesh lives inside the node, so subtract them in the node's
        // space. Mixing the two adds the node's own offset twice and the organs land off-node —
        // which is what "empty nodes beside a body full of organs" was.
        const tl = p.mesh.parent.worldToLocal(target.clone());
        const cl = p.mesh.parent.worldToLocal(c2.clone());
        p.mesh.position.add(tl.sub(cl));
      });
    }

    meshes.forEach(p => {
      if (!p.mesh.userData.baseMat) p.mesh.userData.baseMat = p.mesh.material;
      if (!p.mesh.userData.tintMat) {
        p.mesh.userData.tintMat = new THREE.MeshStandardMaterial({
          color: p.gmeta.color, roughness: 0.62, metalness: 0.04
        });
      }
      p.mesh.material = p.mesh.userData.tintMat;      // a node wears the colour of what it is
    });

    const shadow = row.meta.shadow === true;
    const cloud = g.children.find(c => c.userData.cloud);
    if (cloud) {
      cloud.visible = scattered && !shadow;            // only a group marked `cloud`
      cloud.children.forEach((s, i) => {
        s.material.color.setHex(row.meta.color);
      });
    }
    // the cloud is the node: a sphere the rays can hit, so clicking the haze selects it
    let pick = g.children.find(c => c.userData.pickSphere);
    if (!pick) {
      pick = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      pick.userData.pickSphere = true;
      g.add(pick);
    }
    pick.visible = shadow || scattered;
    pick.scale.setScalar(shadow ? 0.17 : (scattered ? R * 1.45 : R));
    if (shadow) { pick.material.opacity = 0; pick.material.depthWrite = false; }   // click target only

    // a shadow system is a small lit sphere: light and shade say "ball", a flat disc says "stain"
    let sball = g.children.find(c => c.userData.shadowBall);
    if (!sball) {
      sball = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20),
        new THREE.MeshStandardMaterial({
          color: row.meta.color, emissive: row.meta.color, emissiveIntensity: 0.55,
          roughness: 0.28, metalness: 0.12, transparent: true, opacity: 0.75, depthWrite: false
        }));
      sball.userData.shadowBall = true;
      sball.raycast = () => {};
      g.add(sball);
    }
    sball.visible = false;   // the sphere is gone: no bubbles
    if (shadow) {
      sball.scale.setScalar(0.13);                       // half the old radius
      sball.material.color.setHex(row.meta.color);
      sball.material.emissive.setHex(row.meta.color);
    }
    pick.userData.groupId = row.meta.id;
    g.userData.scattered = scattered;

    g.userData.cLocal = new THREE.Vector3(0, 0, 0);
    g.userData.wantPos = row.pos.clone();
    g.userData.wantScale = 1;
    o.parts = row.parts;
    o.target = row.pos;
    o.parentKey = row.parent ? row.parent.key : null;
  });

  /* a single mesh that left its group is a small node of its own, same idea one size down */
  const leafRows = [];
  rows.forEach(row => row.leaves.forEach(p => leafRows.push({ part: p, parent: row })));
  const wantedLeaves = new Set(leafRows.map(l => meshKey(l.part.name)));
  partNodes = partNodes.filter(pn => {
    if (wantedLeaves.has(pn.key)) return true;
    inner.add(pn.part.mesh);
    pn.part.mesh.position.copy(pn.part.home.p); pn.part.mesh.quaternion.copy(pn.part.home.q); pn.part.mesh.scale.copy(pn.part.home.s);
    pn.node.removeFromParent();
    return false;
  });

  const byParent = new Map();
  leafRows.forEach(l => {
    if (!byParent.has(l.parent)) byParent.set(l.parent, []);
    byParent.get(l.parent).push(l);
  });
  byParent.forEach((list, parentRow) => {
    const N = list.length;
    list.forEach((l, i) => {
      const h = hashStr(l.part.name + i);
      const u = new THREE.Vector3(((h % 97) / 97) - 0.5, (((h >> 7) % 89) / 89) - 0.5, (((h >> 13) % 83) / 83) - 0.5).normalize();
      const t = parentRow.pos.clone().add(u.multiplyScalar(levelR(parentRow.depth) * 3.2));
      let pn = partNodes.find(x => x.key === meshKey(l.part.name));
      if (!pn) {
        const g = new THREE.Group();
        g.userData.partName = l.part.name;
        g.userData.nodeLabel = partLabel(l.part.name);
        g.userData.groupId = parentRow.meta.id;
        const R = 0.05;                                  // half the old radius
        g.userData.radius = R;
        const ball = new THREE.Mesh(new THREE.SphereGeometry(R, 24, 16),
          new THREE.MeshStandardMaterial({ color: parentRow.meta.color, roughness: 0.42,
            metalness: 0.05 }));                         // lit and solid: a ball, not a disc
        ball.userData.ball = true;
        g.add(ball);
        const holder = new THREE.Group(); holder.userData.holder = true; g.add(holder);
        g.position.copy(t);
        organRoot.add(g);
        pn = { key: meshKey(l.part.name), node: g, part: l.part, parent: parentRow };
        partNodes.push(pn);
      }
      const g = pn.node;
      const holder = g.children.find(c => c.userData.holder);
      if (l.part.mesh.parent !== holder) holder.attach(l.part.mesh);
      holder.scale.setScalar(1); holder.position.set(0, 0, 0);
      holder.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(holder);
      if (!box.isEmpty()) {
        const s = box.getSize(new THREE.Vector3());
        const cw = box.getCenter(new THREE.Vector3());
        const k = (0.05 * 0.85) / Math.max(1e-4, Math.max(s.x, s.y, s.z));
        holder.scale.setScalar(k);
        holder.position.copy(g.worldToLocal(cw.clone()).multiplyScalar(-k));
      }
      pn.parent = parentRow;
      pn.target = t;
      g.userData.wantPos = t.clone();
      g.userData.wantScale = 1;
      g.userData.cLocal = new THREE.Vector3(0, 0, 0);
    });
  });

  /* the set itself is a semi-transparent copy of the whole organ model, standing at the centre the
     expanded organs radiate from — never inside the body, never a dot */

  /* a shadow system is not a container: it is bound by links to the nodes that hold its organs */
  const rowByKey = new Map(rows.map(r => [r.key, r]));
  linkPairs = [];
  rows.filter(r => r.meta.shadow).forEach(sh => {
    const hosts = new Set();
    organParts.forEach(p => {
      if (!sexOn(p.sex)) return;
      let under = false, n = p.origin;
      while (n) { if (n.id === sh.key) { under = true; break; } n = n.parent; }
      let hostNode = p.node;
      while (hostNode && !rowByKey.has(hostNode.id)) hostNode = hostNode.parent;
      if (under && hostNode && hostNode.id !== sh.key) hosts.add(hostNode.id);
    });
    hosts.forEach(hid => linkPairs.push({ a: sh.key, b: hid, type: sh.key }));
  });

  edgePairs = organNodes.map(o => ({
    a: o.node,
    b: o.parentKey ? (organNodes.find(x => x.key === o.parentKey) || {}).node || null : null
  }));
  partNodes.forEach(pn => edgePairs.push({ a: pn.node, b: pn.parent.node }));
  ensureEdges();
  ensureLinks();
  /* the set node the systems radiate from: a transparent copy of the whole set, standing where
     the expansion starts. syncOrgans() decides which of its organs are visible. */
  if (organNodes.length) {
    const g = makeGhost();
    if (g.parent !== organRoot) organRoot.add(g);
    if (!g.children.some(c => c.userData.setMarker)) {
      const mk = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16),
        new THREE.MeshStandardMaterial({ color: 0xb0728c, roughness: 0.6, metalness: 0, transparent: true, opacity: 0.45 }));
      mk.userData.setMarker = true;
      g.add(mk);
    }
    // exactly where the edges radiate from: the set and the lines that point at it must agree
    g.position.copy(setCentre());
    g.scale.setScalar(1);
  }
  // the graph gained or lost a node: the old frame pointed at something that is no longer there
  if (had !== organNodes.length) camKey = "";
  syncOrgans();
}

function disposeOrganNodes() {
  camKey = "";                                  // back to a frame of the body, not of a node that is gone
  const inner = groups.organs.userData.inner;
  partNodes.forEach(pn => {
    if (pn.part.mesh.userData.baseMat) pn.part.mesh.material = pn.part.mesh.userData.baseMat;
    inner.add(pn.part.mesh);
    pn.part.mesh.position.copy(pn.part.home.p); pn.part.mesh.quaternion.copy(pn.part.home.q); pn.part.mesh.scale.copy(pn.part.home.s);
    pn.node.removeFromParent();
  });
  partNodes = [];
  organNodes.forEach(o => {
    o.parts.forEach(p => {
      if (p.mesh.userData.baseMat) p.mesh.material = p.mesh.userData.baseMat;
      if (p.mesh.parent === inner) return;
      inner.attach(p.mesh);
      p.mesh.position.set(0, 0, 0); p.mesh.scale.setScalar(1); p.mesh.quaternion.set(0, 0, 0, 1);
    });
    o.node.removeFromParent();
  });
  organNodes = [];
  edgePairs = [];
  if (organGhost) organGhost.visible = true;
  if (organRoot) { organRoot.removeFromParent(); organRoot = null; }
  if (edges) { scene.remove(edges); edges.geometry.dispose(); edges = null; }
}

let linkObjs = {};                 // one LineSegments per link type
const LINK_COLOR = { endocrine: 0xb8a8c8, immune: 0xd8a8b8 };

function ensureLinks() {
  Object.keys(linkObjs).forEach(t => {
    if (linkPairs.some(l => l.type === t)) return;
    scene.remove(linkObjs[t]); linkObjs[t].geometry.dispose(); delete linkObjs[t];
  });
  const byType = {};
  linkPairs.forEach(l => { (byType[l.type] = byType[l.type] || []).push(l); });
  Object.entries(byType).forEach(([t, list]) => {
    let o = linkObjs[t];
    if (!o || o.geometry.attributes.position.array.length !== list.length * 6) {
      if (o) { scene.remove(o); o.geometry.dispose(); }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(list.length * 6), 3));
      o = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
        color: LINK_COLOR[t] || 0x8a7a9a, transparent: true, opacity: 0.75, depthWrite: false
      }));
      o.userData.linkType = t;
      scene.add(o);
      linkObjs[t] = o;
    }
    o.userData.list = list;
    o.visible = !state.edgeOff.has(t);
  });
}

function updateLinks() {
  Object.values(linkObjs).forEach(o => {
    const list = o.userData.list || [];
    const arr = o.geometry.attributes.position.array;
    list.forEach((l, i) => {
      const A = organNodes.find(x => x.key === l.a), B = organNodes.find(x => x.key === l.b);
      if (!A || !B) return;
      const a = A.node.position, b = B.node.position;
      arr[i * 6] = a.x; arr[i * 6 + 1] = a.y; arr[i * 6 + 2] = a.z;
      arr[i * 6 + 3] = b.x; arr[i * 6 + 4] = b.y; arr[i * 6 + 5] = b.z;
    });
    o.geometry.attributes.position.needsUpdate = true;
    o.geometry.computeBoundingSphere();
  });
}

function applyEdgeState() {
  if (edges) edges.visible = !state.edgeOff.has("tree");
  Object.entries(linkObjs).forEach(([t, o]) => { o.visible = !state.edgeOff.has(t); });
}

function ensureEdges() {
  if (edges) {
    const need = edgePairs.length * 6;
    if (edges.geometry.attributes.position.array.length !== need) {
      scene.remove(edges); edges.geometry.dispose(); edges = null;
    } else return;
  }
  if (!edgePairs.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(edgePairs.length * 6), 3));
  edges = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x6b5a78, transparent: true, opacity: 0.5, depthWrite: false
  }));
  scene.add(edges);
  applyEdgeState();
}

function updateEdges() {
  if (!edges) return;
  const arr = edges.geometry.attributes.position.array;
  const set = setCentre();
  edgePairs.forEach((e, i) => {
    e.a.updateMatrixWorld(true);
    const a = e.a.localToWorld(e.a.userData.cLocal.clone());
    let b = set;
    if (e.b) { e.b.updateMatrixWorld(true); b = e.b.localToWorld(e.b.userData.cLocal.clone()); }
    arr[i * 6] = a.x; arr[i * 6 + 1] = a.y; arr[i * 6 + 2] = a.z;
    arr[i * 6 + 3] = b.x; arr[i * 6 + 4] = b.y; arr[i * 6 + 5] = b.z;
  });
  edges.geometry.attributes.position.needsUpdate = true;
  edges.geometry.computeBoundingSphere();
}

function makeGhost() {
  if (organGhost) return organGhost;
  const inner = groups.organs.userData.inner;
  organGhost = new THREE.Group();
  organGhost.name = "organGhost";
  organGhost.userData.nodeLabel = "all organs";
  organGhost.userData.setId = "organs";
  organParts.filter(p => sexOn(p.sex)).forEach(p => {
    const base = p.mesh.material && p.mesh.material.color ? p.mesh.material.color.clone() : new THREE.Color(0xc8a8c0);
    const m = new THREE.Mesh(p.mesh.geometry, new THREE.MeshStandardMaterial({
      color: base, roughness: 0.85, metalness: 0,
      transparent: true, opacity: 0.26, depthWrite: false, side: THREE.DoubleSide
    }));
    // the geometry is already in body coordinates: identity transform, wherever the real organ is now
    m.userData.kind = "organSet";
    m.userData.ghost = true;
    m.userData.ghostKey = meshKey(p.mesh.name);
    m.userData.systemId = p.node ? p.node.id : null;
    organGhost.add(m);
  });
  /* the geometry sits in body coordinates, so the copy is re-centred on its own origin: this node
     stands where the expansion radiates from, not where the organs sit in the body */
  organGhost.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  organGhost.children.forEach(m => bb.expandByObject(m));
  if (!bb.isEmpty()) {
    const cc = bb.getCenter(new THREE.Vector3());
    organGhost.children.forEach(m => m.position.sub(cc));
  }
  (organRoot || scene).add(organGhost);
  organGhost.position.copy(setCentre());
  return organGhost;
}

/* Her head is a different skull from the atlas one. The atlas muscles (the eyelids and lips
   especially), the teeth and the eyeballs sit for a male head, and at 45 % skin they read as four
   eyes, floating lashes and teeth through the lips. Inside her body those layers lose the head;
   taken out as nodes they keep all of it. */
let headCutMats = [];
let headCutMeshes = [];

/* Her head is a different skull from the atlas one: his muscles, teeth and eyeballs are bigger and
   stick out of her face. Cut the atlas layers at her jaw while they sit in the body; taken out as
   nodes they keep everything. The shell's head is drawn opaque (see paint()), so the gap never shows. */
function bodyHeadCut() {
  // Anything that lives entirely inside the head is hidden while the shell is on: a transparent head
  // then shows an empty volume instead of a glass skull, glowing eyes and teeth.
  headCutMeshes.forEach(o => { o.visible = true; });
  headCutMeshes = [];
  if (state.out.has("skin")) return;                 // shell off: the atlas head is all there is
  const CUT = 0.585;                                 // the jaw line in scene units
  const shellOf = m => m && (m === groups.skin || (m.parent && m.parent.userData && m.parent.userData.variant === state.sex));
  // this cut is about the BODY's head. A graph node floating above the jaw line is not "inside the
  // head" — it is a node, and hiding it by height is what made the heart, the lungs and the gut
  // vanish the moment they were split out of the body.
  const inGraph = o => {
    for (let p = o; p; p = p.parent) {
      if (p === organRoot) return true;                                  // a split node
      if (p === groups.organs && state.out.has("organs")) return true;   // the organ set, taken out
    }
    return false;
  };
  scene.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    if (o.userData.ball || o.userData.cloudLayer || o.userData.shadowBall || o.userData.ghost) return;
    if (inGraph(o)) return;
    if (/^skinbits/.test(o.name)) { o.visible = false; headCutMeshes.push(o); return; }
    if (/-head$/.test(o.name) || o.name === "skin" || /^skin-female2$/.test(o.name)) return;   // the shell itself
    const b = new THREE.Box3().setFromObject(o);
    if (b.isEmpty()) return;
    const c = b.getCenter(new THREE.Vector3());
    // by centre, not by minimum: the skull and the face muscles reach down into the neck, so a
    // min.y test never catches them
    if (c.y <= CUT + 0.02) return;
    o.visible = false;
    headCutMeshes.push(o);
  });
}

function layout() {
  // the set node exists only while the set is one thing; split it and the ghost has nothing to say
  if (organGhost) organGhost.visible = !state.organsOut;
  if (!bodyBox) return;
  const width = bodyBox.getSize(new THREE.Vector3()).x;
  const graph = state.organsOut;

  // the organs set must be out before it can be split
  if (graph && !state.out.has("organs")) state.out.add("organs");

  // every layer that has been taken out takes a slot beside the body; the body itself never moves
  // and never loses a layer that is still collapsed
  const outList = LAYERS.filter(l => !l.graphOnly && state.out.has(l.id));
  const bodyOut = outList.filter(l => l.id !== "organs");
  const organsOut = state.out.has("organs");

  // the body layers take turns left and right of the body, each one clear of the last and all on
  // one horizontal level: the body stays at the centre, marked by the faint copy of the skin
  // the layers go round the body on one level: one in front, one behind, one on each flank and the
  // diagonals between — a ring in the horizontal plane, the body at its centre
  const gapX = width * 0.30, slot = {};
  const widest = bodyOut.reduce((m, l) => Math.max(m, layerSize[l.id] ? layerSize[l.id].x : width), width);
  const ringR = Math.max(width * 3.4, (bodyOut.length * (widest + width * 0.55)) / (Math.PI * 2) * 1.3);
  let rc = width * 0.5, lc = -width * 0.5;
  if (bodyOut.length) { rc = ringR + widest * 0.55 + gapX; lc = -rc; }
  bodyOut.forEach((l, i) => {
    // half a step off the front: a layer standing dead in front of the body both hides it and
    // eats the click that was meant for the body
    const a = (i / bodyOut.length) * Math.PI * 2 + Math.PI / 3;
    slot[l.id] = { x: Math.cos(a) * ringR, z: Math.sin(a) * ringR };
  });
  if (organsOut) {
    // out has to be visible: the set leaves the body and stands beside it, far enough that the tree
    // that fans out around it never reaches back into the body
    slot.organs = { x: width * 0.5 + (graph ? ORGAN_R + 0.15 : 0) + organSize.x * 0.5 + width * 0.22, z: 0 };
  }

  LAYERS.forEach(l => {
    if (l.graphOnly) return;
    const t = targets[l.id];
    const s = slot[l.id];
    if (s) t.p.set(s.x, -(layerMid[l.id] ? layerMid[l.id].y : 0), s.z);
    else t.p.set(0, 0, 0);
    // the organs are what makes the body the body; with them out, the remainder is a node among
    // nodes, so it shrinks to roughly the size of the organs set
    t.s = (slot[l.id] === undefined && organsOut) ? bodyShrink() : 1;
  });

  if (graph) buildOrganNodes(); else disposeOrganNodes();
  const ghost = null;               // no copy in the body: a second set of organs reads as organs that never left

  // the body cloud: a copy of the skin, a little more opaque than the organs copy, so the layers
  // that left are visibly circling something
  if (bodyOut.length && !bodyGhost) makeBodyGhost();
  if (bodyGhost) bodyGhost.visible = bodyOut.length > 0;

  LAYERS.forEach(l => {
    const g = groups[l.id];
    if (!g) return;
    if (l.graphOnly) { g.visible = false; return; }
    const isOut = state.out.has(l.id);
    g.visible = true;          // the skin is a layer like any other: in the body, or a node.
  });
  organParts.forEach(p => { p.mesh.visible = partShown(p); });
  bodyHeadCut();

  const skinG = groups.skin;
  const skinOut = state.out.has("skin");
  if (skinG) skinG.traverse(o => {
    if (!o.isMesh || !o.material) return;
    o.material.transparent = !skinOut;
    o.material.opacity = skinOut ? 1 : SHELL_OPACITY;
    o.material.depthWrite = skinOut;
  });
  const mus = groups.muscles;
  if (mus) {
    const see = !state.out.has("muscles");       // collapsed in the body: let the inside show
    mus.traverse(o => { if (o.isMesh && o.material) { o.material.transparent = see; o.material.opacity = see ? 0.38 : 1; o.material.depthWrite = !see; } });
  }

  // what the camera frames: once the organs are split they are the work surface, and fitting the
  // whole ring plus the fan at once made every organ a speck. Splitting now flies to the fan; the
  // ring is still there, a zoom-out away
  let spanW, spanH, cx;
  if (graph) {
    // frame the body and the nodes that are out together: the body is the anchor that says what
    // left it, and framing the tree alone pushes the body behind the panel
    const c = setCentre();
    let rad = 0.4;
    organNodes.forEach(o => {
      const p = o.target || o.node.position;
      rad = Math.max(rad, p.distanceTo(c) + organMaxNode * 0.55 + 0.08);
    });
    partNodes.forEach(pn => {
      const p = pn.target || pn.node.position;
      rad = Math.max(rad, p.distanceTo(c) + PART_NODE_SIZE * 0.9);
    });
    let minX = c.x - rad, maxX = c.x + rad, minY = -rad, maxY = rad;
    if (bodyBox && !bodyBox.isEmpty()) {
      minX = Math.min(minX, bodyBox.min.x - 0.12); maxX = Math.max(maxX, bodyBox.max.x + 0.12);
      minY = Math.min(minY, bodyBox.min.y - 0.06); maxY = Math.max(maxY, bodyBox.max.y + 0.06);
    }
    spanW = Math.max(0.8, maxX - minX); spanH = Math.max(0.8, maxY - minY); cx = (minX + maxX) / 2;
  } else {
    const left = lc - width * 0.30;
    let right = rc + width * 0.30;
    if (organsOut) {
      right = Math.max(right, slot.organs.x + (organSize.x / 2) * 1.2);
      // the split graph is part of the picture: a camera framed on the body alone leaves half of
      // it outside the frustum, which is what "where are the organs" looked like
      organNodes.forEach(o => { right = Math.max(right, o.node.position.x + 0.55); });
    }
    spanW = Math.max(width * 1.1, right - left);
    spanH = 1.8;
    cx = (left + right) / 2;
  }
  // the panel sits over the canvas, so the scene is fitted into the strip to its right instead of
  // being centred on the window (which pushed the leftmost layer behind the panel)
  const panelL = state.collapsed ? 28 : 236, panelR = state.sel ? 320 : 0;
  const visW = Math.max(320, innerWidth - panelL - panelR);
  const grow = innerWidth / visW;
  const d = fitDistance(spanW * grow, spanH);
  const dx = ((panelL + visW / 2) / innerWidth - 0.5) * spanW * grow;
  // once the layers are on the ring the camera has to look slightly down, or a ring seen edge-on
  // is just a pile of overlapping bodies
  const elev = (!graph && bodyOut.length > 1) ? 0.45 : 0.06;
  // re-frame only when the scene itself changed: selecting a node, or the user having zoomed
  // somewhere, must not snap the view back to the overview
  // the selection is not part of this: opening the panel must not move the camera the user has
  // just zoomed
  /* When organs are split the picture is the body AND the six nodes beside it. Framing it from
     the layer slots — which know nothing about where the graph solved — left half of it outside
     the frustum. The frame is the union of what is actually on screen. */
  if (organNodes.length) {          // only a split graph redefines the frame; analyses alone do not
    const b = new THREE.Box3();
    if (bodyBox) b.union(bodyBox);
    organNodes.forEach(o => b.expandByPoint(o.node.position));
    ANALYSES.forEach(a => { if (a.node && a.node.visible) b.expandByPoint(a.node.position); });
    if (!b.isEmpty()) {
      const sz = b.getSize(new THREE.Vector3()), ct = b.getCenter(new THREE.Vector3());
      spanW = Math.max(sz.x, 1.8); spanH = Math.max(sz.y, 1.8);
      cx = ct.x;
    }
  }

  const camKeyNow = [...state.out].sort().join("+") + "|" + [...state.nodeOut].sort().join(",") + "|" + graph + "|" + state.collapsed;
  if (camKeyNow !== camKey) {
    camKey = camKeyNow;
    // the frame is already the union of what is on screen, so it can be trusted: clamping it here
    // is what pushed the rightmost nodes out of the frustum and left "empty" space where organs were
    const dd = Math.max(d, 4.2);   // never closer than this: the body has to fit with its head

    camWant.pos.set(cx - dx, dd * elev, dd);
    camWant.target.set(cx - dx, 0, 0);
    camAnim = true;
    camUntil = performance.now() + 1400;
  }
}

/* selecting changes the width the scene has to live in (the panel takes 320 px), so the frame is
   recomputed once, after the panel is in place — this is why nodes used to end up under the panel */
function select(id) {
  selectInner(id);
  camKey = "";
  layout();
  const o = id ? objectForSel(id) : null;
  if (o) focusOn(o);          // the panel changes the frame; the node itself is what we look at
}

function pickAt(x, y) {
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObjects(scene.children, true);
  const shown = o => { let p = o; while (p) { if (!p.visible) return false; p = p.parent; } return true; };
  for (const h of hits) {
    if (!shown(h.object)) continue;
    let o = h.object, layerId = null, label = null, groupId = null, setId = null, partName = null;
    while (o) {
      if (o.userData && o.userData.analysisId) return { analysis: o.userData.analysis, label: o.userData.nodeLabel };
      if (o.userData && o.userData.partName) { partName = o.userData.partName; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.groupId) { groupId = o.userData.groupId; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.setId) { setId = o.userData.setId; label = o.userData.nodeLabel; break; }
      if (o.userData && o.userData.layerId) { layerId = o.userData.layerId; break; }
      o = o.parent;
    }
    if (!label && layerId) {
      const l = LAYERS.find(x => x.id === layerId);
      label = l ? l.name : layerId;
    }
    if (label || layerId) return { layerId, label, groupId, setId, partName };
  }
  return null;
}

let downAt = null;
let hoverAt = 0;
renderer.domElement.addEventListener("pointermove", e => {
  const now = performance.now();
  if (now - hoverAt < 60) return;
  hoverAt = now;
  const tip = document.getElementById("tip");
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit || !hit.label) { tip.style.display = "none"; return; }
  tip.textContent = hit.label;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 16) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
renderer.domElement.addEventListener("pointerdown", e => {
  downAt = { x: e.clientX, y: e.clientY };
  camAnim = false;                       // the user takes the camera the moment they touch it
});
renderer.domElement.addEventListener("wheel", () => { camAnim = false; }, { passive: true });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;                       // that was an orbit drag, not a click
  const hit = pickAt(e.clientX, e.clientY);
  if (!hit) { select(null); return; }                       // a click on empty space clears it
  if (hit.analysis) { selectAnalysis(hit.analysis); return; }    // a document: show what it says
  if (hit.partName) { select(meshKey(hit.partName)); return; }   // a part node: show what it is
  if (hit.groupId) { select(hit.groupId); return; }        // an organ node: show what it is
  if (hit.setId) {                                          // the organs set: select it, say what it is
    select("organs");                                       // splitting is an explicit action in the panel
    return;
  }
  if (hit.layerId) {
    select(hit.layerId);                                    // the body and its layers are nodes: select them
  }
});

const TL_META = (KGDATA && KGDATA.meta) || {};
const BIRTH = new Date(TL_META.birth || "1984-03-01");
const LE_BY_SEX = TL_META.life_expectancy || { male: 74, female: 80 };

const ANALYSES = (((KGDATA && KGDATA.nodes) || []).filter(n => n.kind === "analysis").length
  ? KGDATA.nodes.filter(n => n.kind === "analysis")
  : SAMPLE_ANALYSES).map(n => ({

    panel: n.panel || "", values: n.values || [], summary: n.summary || "",
    affects: n.affects || [], track: n.track || n.id, link: n.link || "",
    delta: Number.isFinite(Number(n.delta)) ? Number(n.delta) : null,
    evidence: Math.max(0, Math.min(100, Number(n.evidence ?? 50))),
    confidence: Math.max(0, Math.min(100, Number(n.confidence ?? 50))),

/* ---- the projection: a baseline life expectancy, moved by what the documents say */
function deltaOf(a) {
  return a.delta !== null ? a.delta : Math.max(-2, Math.min(2, (a.evidence - 50) / 25));
}
function latestByTrack() {
  const m = new Map();
  ANALYSES.forEach(a => {
    const cur = m.get(a.track);
    if (!cur || +a.at > +cur.at) m.set(a.track, a);        // a repeat supersedes the older one
  });
  return m;
}
function lifeExpectancy() {
  const base = LE_BY_SEX[state.sex] ?? LE_BY_SEX.male ?? 76;
  let le = base;
  latestByTrack().forEach(a => { le += deltaOf(a); });
  return le;
}
function baselineLE() { return LE_BY_SEX[state.sex] ?? LE_BY_SEX.male ?? 76; }
function annualRisk(age) {                       // death in the next year, given you reached it
  const m = lifeExpectancy(), b = 9;
  return 1 - Math.exp(-Math.exp((age - m) / b) / b);
}
const HEALTH_STOPS = [[0, [192, 57, 43]], [50, [216, 195, 63]], [100, [63, 174, 122]]];
const RISK_STOPS = [[0, [63, 127, 208]], [0.02, [63, 174, 122]], [0.08, [201, 194, 63]],
                    [0.22, [204, 106, 47]], [0.45, [0, 0, 0]], [1, [0, 0, 0]]];
function grad(stops, v) {
  for (let i = 1; i < stops.length; i++) {
    if (v <= stops[i][0]) {
      const [a, ca] = stops[i - 1], [b, cb] = stops[i];
      const t = (v - a) / (b - a || 1);
      const c = ca.map((x, k) => Math.round(x + (cb[k] - x) * t));
      return "#" + c.map(x => x.toString(16).padStart(2, "0")).join("");
    }
  }
  return "#000000";
}
const healthColour = ev => grad(HEALTH_STOPS, ev);
const riskColour = r => grad(RISK_STOPS, r);
const ageAt = d => (+d - +BIRTH) / (365.25 * 864e5);

/* ---- the ruler: piecewise, so the two years around today can be read month by month */
const TL = { track: document.getElementById("tlTrack"), card: document.getElementById("tlCard"),
             winFrom: null, winTo: null, xw0: 0, xw1: 0, stepY: 7, stepM: 9, endYear: 0 };

function monthDiff(a, b) { return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); }
function xOf(d) {
  if (+d < +TL.winFrom) return (+d - +BIRTH) / (365.25 * 864e5) * TL.stepY;
  if (+d <= +TL.winTo) return TL.xw0 + monthDiff(TL.winFrom, d) * TL.stepM;
  return TL.xw1 + (+d - +TL.winTo) / (365.25 * 864e5) * TL.stepY;
}
function iso(d) { return d.toISOString().slice(0, 10); }

function buildTimeline() {
  const T = TL.track;
  if (!T) return;
  T.innerHTML = "";
  const now = new Date();
  const wf = new Date(now.getFullYear() - 2, now.getMonth(), 1);
  const wt = new Date(now.getFullYear() + 2, now.getMonth() + 1, 0);
  const W = Math.max(560, window.innerWidth - 244 - 14);
  const months = monthDiff(wf, wt) + 1;
  TL.winFrom = wf; TL.winTo = wt;
  TL.stepM = Math.max(4, Math.min(12, Math.floor((W * 0.42) / months)));
  TL.xw0 = monthDiff(BIRTH, wf) * 0;                 // set below from the year run
  const yearsBefore = (+wf - +BIRTH) / (365.25 * 864e5);
  const yearsAfter = 100 - ageAt(wt);
  TL.stepY = Math.max(3.2, (W - months * TL.stepM) / Math.max(1, yearsBefore + yearsAfter));
  TL.xw0 = yearsBefore * TL.stepY;
  TL.xw1 = TL.xw0 + months * TL.stepM;
  TL.endYear = Math.max(BIRTH.getFullYear() + 100, now.getFullYear() + 40);

  const base = document.createElement("div"); base.className = "base"; T.appendChild(base);
  const band = document.createElement("div"); band.className = "band";
  band.style.left = TL.xw0 + "px"; band.style.width = (TL.xw1 - TL.xw0) + "px"; T.appendChild(band);

  if (!TL.pickBound) {
    TL.pickBound = true;
    // anywhere on the strip picks a date: hunting for a 1-pixel tick is not a way to use a timeline
    document.getElementById("tl").addEventListener("pointerdown", e => {
      if (e.target.closest(".tick")) return;
      const r = T.getBoundingClientRect();
      const x = e.clientX - r.left;
      let lo = +BIRTH, hi = new Date(TL.endYear, 0, 1).getTime();
      if (!(hi > lo) || !TL.stepY) return;
      for (let i = 0; i < 56; i++) {
        const mid = (lo + hi) / 2;
        if (xOf(new Date(mid)) < x) lo = mid; else hi = mid;
      }
      const d = new Date((lo + hi) / 2); d.setDate(1);
      state.date = iso(d); paintFade(); refreshPick(); buildTimeline();
    });
  }

  const perMonth = new Map(), perYear = new Map();
  ANALYSES.forEach(a => {
    const k = a.at.getFullYear() + "-" + String(a.at.getMonth() + 1).padStart(2, "0");
    if (!perMonth.has(k)) perMonth.set(k, []);
    perMonth.get(k).push(a);
  });

  const tick = (d, cls, label, big) => {
    const el = document.createElement("div");
    el.className = "tick " + cls;
    el.style.left = xOf(d).toFixed(1) + "px";
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    const hits = perMonth.get(k) || [];
    if (cls === "m" && hits.length) el.classList.add("has");
    if (state.date === iso(d)) el.classList.add("pick");
    el._date = d; el._hits = hits;
    if (+d > Date.now()) el.style.background = riskColour(annualRisk(ageAt(d)));
    el.addEventListener("mouseenter", e => tlCard(e, d, hits));
    el.addEventListener("mouseleave", () => { TL.card.hidden = true; });
    el.addEventListener("click", () => { state.date = iso(d); paintFade(); refreshPick(); });
    if (label) {
      const l = document.createElement("div");
      l.className = "lbl" + (big ? " big" : "");
      l.style.left = xOf(d).toFixed(1) + "px"; l.textContent = label;
      T.appendChild(l);
    }
    T.appendChild(el);
  };

  for (let y = BIRTH.getFullYear(); y <= TL.endYear; y++) {
    const d = new Date(y, 0, 1);
    if (+d >= +TL.winFrom && +d <= +TL.winTo) continue;
    const hits = ANALYSES.filter(a => a.at.getFullYear() === y);
    const el = document.createElement("div");
    el.className = "tick" + (y % 5 === 0 ? " y5" : "") + (hits.length ? " has" : "");
    el.style.left = xOf(d).toFixed(1) + "px";
    el._date = d; el._hits = hits;
    el.addEventListener("mouseenter", e => tlCard(e, d, hits));
    el.addEventListener("mouseleave", () => { TL.card.hidden = true; });
    el.addEventListener("click", () => { state.date = iso(d); paintFade(); refreshPick(); });
    T.appendChild(el);
    const every = Math.max(5, Math.ceil(26 / Math.max(1, TL.stepY)));   // a label needs ~26 px
    if (y % every === 0 || y === now.getFullYear()) {
      const l = document.createElement("div");
      l.className = "lbl" + (y === now.getFullYear() ? " big" : "");
      l.style.left = xOf(d).toFixed(1) + "px"; l.textContent = y;
      T.appendChild(l);
    }
  }
  for (let i = 0; i < months; i++) {
    const d = new Date(wf.getFullYear(), wf.getMonth() + i, 1);
    if (+d < +BIRTH) continue;
    tick(d, "m", d.getMonth() === 0 ? String(d.getFullYear()) : null, false);
  }

  // the future, painted by the risk at that age
  for (let y = now.getFullYear(); y <= TL.endYear; y++) {
    const d = new Date(y, 0, 1);
    if (+d <= +now) continue;
    const c = riskColour(annualRisk(ageAt(d)));
    const el = [...T.children].find(e => e._date && +e._date === +d);
    if (el) el.style.background = c;
  }

  const nw = document.createElement("div"); nw.className = "now";
  nw.style.left = xOf(now).toFixed(1) + "px"; T.appendChild(nw);
}

function refreshPick() {
  [...TL.track.children].forEach(el => {
    if (!el._date) return;
    el.classList.toggle("pick", state.date === iso(el._date));
  });
}

function tlCard(e, d, hits) {
  const C = TL.card;
  const list = hits.length ? hits : ANALYSES.filter(a => a.at.getFullYear() === d.getFullYear() &&
                                                         a.at.getMonth() === d.getMonth());
  C.innerHTML = "";
  const h = document.createElement("h6");
  h.textContent = d.toLocaleDateString(undefined, { year: "numeric", month: "short" });
  C.appendChild(h);
  if (!list.length) {
    const p = document.createElement("div"); p.className = "no";
    p.textContent = "no analyses"; C.appendChild(p);
  } else {
    list.forEach(a => {
      const row = document.createElement("div"); row.className = "it";
      const dot = document.createElement("i"); dot.style.background = healthColour(a.evidence);
      const t = document.createElement("span");
      t.textContent = a.label + " · " + a.organ;
      row.appendChild(dot); row.appendChild(t); C.appendChild(row);
    });
  }
  C.hidden = false;
  const r = C.getBoundingClientRect();
  C.style.left = Math.min(window.innerWidth - r.width - 12, e.clientX - r.width / 2) + "px";
  C.style.top = "118px";
}

/* ---- an analysis on the graph: a node, an edge, two numbers */
let analysisRoot = null, analysisNodes = [];
const NODE_R = 0.055;

function buildAnalyses() {
  if (!ANALYSES.length) return;
  analysisRoot = new THREE.Group();
  analysisRoot.name = "analyses";
  scene.add(analysisRoot);
  ANALYSES.forEach((a, i) => {
    const g = new THREE.Group();
    g.userData.nodeLabel = a.label + " · " + (a.organ || "—");
    g.userData.analysis = a;
    g.userData.analysisId = a.id;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(healthColour(a.evidence)), roughness: 0.4, metalness: 0.05,
      transparent: true, opacity: 1, emissive: new THREE.Color(healthColour(a.evidence)),
      emissiveIntensity: 0.55
    });
    const ball = new THREE.Mesh(new THREE.SphereGeometry(NODE_R, 20, 14), mat);
    g.add(ball);
    g.userData.cLocal = new THREE.Vector3(0, 0, 0);
    analysisRoot.add(g);
    const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(healthColour(a.evidence)),
      transparent: true, opacity: 0.6, depthWrite: false });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, lineMat);
    scene.add(line);
    a.node = g; a.line = line; a.angle = -1.15 + i * 0.72;
    analysisNodes.push(g);
  });
  paintFade();
}

/* the organ itself if it is a node; otherwise the nearest ancestor that is one — an analysis
   must hang off the thing it is about, not off the set the thing happens to sit in */
function anchorKeyFor(organ) {
  let n = NODE_BY_ID[organ];
  while (n) {
    if (organNodes.some(o => o.key === n.id)) return n.id;
    n = n.parent;
  }
  return null;
}

function anchorKeyFor(organ) {
  let n = NODE_BY_ID[organ];
  while (n) {
    if (organNodes.some(o => o.key === n.id)) return n.id;
    n = n.parent;
  }
  return null;
}

/* A label is a signpost, not a sticker: it exists only while its node is big enough to be
   worth naming, in front of the camera, outside the panel, and still solid enough to read. */
function anchorFor(a) {
  const key = anchorKeyFor(a.organ);
  if (key) {
    const o = organNodes.find(x => x.key === key);
    if (o) return { obj: o.node, r: o.r || 0.2 };
  }
  if (state.organsOut && organGhost) return { obj: organGhost, r: 0.30 };   // the set is the anchor
  return null;                                              // nothing is split: stand beside the body
}

function fadeFor(a) {
  if (!state.date) return 1;
  const yrs = Math.abs((+new Date(state.date) - +a.at) / (365.25 * 864e5));
  return Math.max(0.07, Math.exp(-yrs / 2));
}

function paintFade() {
  ANALYSES.forEach(a => {
    if (!a.node) return;
    const shown = !state.analysisHidden.has(a.id);
    a.node.visible = shown;
    a.line.visible = shown;
    if (!shown) return;
    const f = fadeFor(a), k = a.confidence / 100;
    // distance changes how solid a document looks, never whether it exists: a node you can see an
    // edge to must be a node you can see
    const op = Math.max(0.35, Math.min(1, 0.35 + 0.65 * k * f));
    a.node.children[0].material.opacity = op;
    a.line.material.opacity = op * 0.8;
  });
}

function updateAnalyses() {
  if (!analysisRoot) return;
  const set = setCentre();
  ANALYSES.forEach(a => {
    if (!a.node) return;
    const an = anchorFor(a);
    let c, p;
    if (an) {
      c = an.obj.localToWorld((an.obj.userData.cLocal || new THREE.Vector3()).clone());
      const rad = an.r + 0.62;
      p = new THREE.Vector3(c.x + Math.cos(a.angle) * rad, c.y + Math.sin(a.angle) * rad,
                            c.z + Math.sin(a.angle * 1.7) * 0.18);
    } else {
      const i = ANALYSES.indexOf(a);
      c = set.clone();
      p = new THREE.Vector3(c.x - 0.95, c.y + 0.35 - i * 0.26, c.z + 0.05);
    }
    a.node.position.copy(p);
    const arr = a.line.geometry.attributes.position.array;
    arr[0] = c.x; arr[1] = c.y; arr[2] = c.z;
    arr[3] = p.x; arr[4] = p.y; arr[5] = p.z;
    a.line.geometry.attributes.position.needsUpdate = true;
    a.line.geometry.computeBoundingSphere();

  });
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const a = 1 - Math.pow(0.001, dt);
  Object.values(groups).forEach(g => {
    const t = targets[g.name]; if (!t) return;
    g.position.lerp(t.p, a);
    g.scale.lerp(new THREE.Vector3(t.s,t.s,t.s), a);
  });
  // whatever changed an eye, the picture follows the same rule; it is 138 parent checks, not work
  syncOrgans();
  // a document is a mark on the map, not an organ: keep it a constant, small size on screen
  if (analysisRoot) {
    ANALYSES.forEach(a => {
      if (!a.node || !a.node.visible) return;
      const d = camera.position.distanceTo(a.node.position);
      a.node.scale.setScalar(Math.max(0.35, Math.min(2.2, d * 0.085)));
    });
  }
  if (partNodes.length) {
    partNodes.forEach(pn => {
      pn.node.position.lerp(pn.node.userData.wantPos, a);
      const s = pn.node.scale.x + (pn.node.userData.wantScale - pn.node.scale.x) * a;
      pn.node.scale.setScalar(s);
    });
  }
  if (organNodes.length) {
    const t = performance.now() / 1000;
    organNodes.forEach(o => {
      o.node.position.lerp(o.node.userData.wantPos, a);
      const s = o.node.scale.x + (o.node.userData.wantScale - o.node.scale.x) * a;
      o.node.scale.setScalar(s);
      if (o.node.userData.scattered) {
        const holder = o.node.children.find(c => c.userData.holder);
        if (holder) {
          holder.rotation.y += dt * 1.1;
          holder.position.y = Math.sin(t * 1.6 + o.node.position.x * 3) * 0.02;
        }
      }
    });
    updateEdges();
    updateLinks();
  }
  updateAnalyses();
  // (the all-organs copy is gone: two nodes for one thing was the bug)
  // the body cloud is the body's shadow, not a snapshot: it follows wherever the body is now
  if (bodyGhost && groups.muscles) {
    bodyGhost.position.copy(groups.muscles.position);
    bodyGhost.scale.copy(groups.muscles.scale);
  }
  if (camAnim) {
    camera.position.lerp(camWant.pos, a);
    controls.target.lerp(camWant.target, a);
    if (camera.position.distanceTo(camWant.pos) < 0.004 || performance.now() > camUntil) camAnim = false;
  }
  controls.update();
  renderer.render(scene, camera);
}
buildLegend();
tick();
boot();

window.addEventListener("resize", () => { if (bodyBox) { buildTimeline(); refreshPick(); } });
window.__ready = () => pending === 0 && !!bodyBox && failedFiles.length === 0;
window.__loadErrors = () => failedFiles.slice();
window.__layer = id => toggleLayer(id);
window.__setSex = s => { state.sex = s; applySex(); };
window.__toggle = id => toggle(id);
window.__expand = () => { if (!state.out.has("organs")) state.out.add("organs"); openAll(); };
window.__organs = (v) => { state.organsOut = v === undefined ? !state.organsOut : !!v; state.treeOpen = state.organsOut; layout(); buildLegend(); };
window.__part = (name, v) => { togglePart(name); };
window.__organNames = () => organParts.map(p => p.name);
window.__groups = () => organNodes.map(g => g.meta.id + ":" + g.parts.length);
window.__group = (id, v) => { setOut(id, !!v); };
window.__edgeCount = () => (edges ? edges.geometry.attributes.position.count / 2 : 0);
window.__nodeCount = () => organNodes.length;
window.__setSkin = () => layout();   // kept for the test scripts; the shell is always on now
window.__collapse = () => document.getElementById("collapse").click();
</script>
</body>
