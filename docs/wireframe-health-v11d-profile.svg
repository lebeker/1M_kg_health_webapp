  <circle cx="374" cy="228" r="7" class="badge"/><text x="374" y="231" class="num" text-anchor="middle">26</text>
  <text x="386" y="258" font-size="20" font-weight="600" fill="#111">Andrei</text>
  <text x="386" y="282" class="ts">male · born 1961 · 65 today</text>
  <text x="792" y="252" class="ts" text-anchor="end">meta.profile — the only place identity lives</text>
  <text x="792" y="268" class="ts" text-anchor="end">no name in the file → the title reads “unnamed profile”</text>
  <text x="792" y="284" class="ts" text-anchor="end">the file has a year, not a birthday: 65 all year</text>

  <!-- 27 cohort -->
  <circle cx="374" cy="318" r="7" class="badge"/><text x="374" y="321" class="num" text-anchor="middle">27</text>
  <text x="390" y="322" class="tm">COHORT · WHAT THE FORECAST IS MEASURED AGAINST</text>
  <text x="386" y="344" class="ts">SCORE2 · 10-year cardiovascular risk · ages 40–69, no previous CVD</text>
  <text x="386" y="362" class="ts">ESC region <tspan style="fill:#111">high</tspan> — asked once per person, not in the document</text>
  <text x="792" y="362" class="ts" text-anchor="end">no default, no guess</text>
  <text x="386" y="380" class="ts">Lee · HRS 1998 · US adults over 50 · 11,701, validated in 8,009</text>
  <text x="386" y="398" class="ts">both are group numbers: a median and a band, labelled as such</text>
  <line x1="386" y1="414" x2="794" y2="414" class="line"/>

