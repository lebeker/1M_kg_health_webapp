    <text x="1416" y="482" text-anchor="end">next 2027-06</text>
  </g>

  <line x1="870" y1="502" x2="1416" y2="502" class="line"/>

  <circle cx="854" cy="524" r="7" class="badge"/><text x="854" y="527" class="num" text-anchor="middle">23</text>
  <text x="870" y="528" class="tm">WHAT WE DO NOT KNOW</text>
  <g class="ts">
    <text x="870" y="550">no family history · no sleep data · no vaccinations</text>
    <text x="870" y="568">no colonoscopy after 60 · no lipid panel for 2025</text>
    <text x="870" y="586">the model does not account for depression or loneliness</text>
  </g>

  <line x1="870" y1="606" x2="1416" y2="606" class="line"/>

  <circle cx="854" cy="628" r="7" class="badge"/><text x="854" y="631" class="num" text-anchor="middle">24</text>
  <text x="870" y="632" class="tm">ON WHAT GROUNDS</text>
  <text x="870" y="652" class="ts">SCORE2 · ESC 2021 · Lee index · model v0.3</text>
  <text x="870" y="670" class="ts">every number carries a source or it is not shown</text>

  <circle cx="854" cy="700" r="7" class="badge"/><text x="854" y="703" class="num" text-anchor="middle">25</text>
  <rect x="868" y="686" width="548" height="60" rx="4" class="dash" fill="none"/>
  <text x="884" y="708" class="ts">empty state: no events yet — forecast is unavailable, not zero</text>
  <text x="884" y="726" class="ts">the app says "not enough data" instead of inventing a number</text>

